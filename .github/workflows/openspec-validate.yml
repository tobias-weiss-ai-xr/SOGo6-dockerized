name: OpenSpec Validation

on:
  push:
    branches: [main, master]
    paths:
      - '.openspec/**'
      - 'sogo6-server/.openspec/**'
      - 'sogo6-ui/.openspec/**'
  pull_request:
    branches: [main, master]
    paths:
      - '.openspec/**'
      - 'sogo6-server/.openspec/**'
      - 'sogo6-ui/.openspec/**'

jobs:
  validate:
    name: Validate OpenSpec
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: 'true'
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install validation tools
        run: |
          npm install -g markdownlint-cli
          pip install codespell

      - name: Validate file structure
        run: |
          echo "📁 Checking OpenSpec structure..."
          
          # Check root repository
          echo "  Root repository:"
          test -f .openspec/project.spec.md && echo "    ✅ project.spec.md" || (echo "    ❌ project.spec.md missing" && exit 1)
          test -d .openspec/specs && echo "    ✅ specs/ directory" || (echo "    ❌ specs/ directory missing" && exit 1)
          test -d .openspec/changes && echo "    ✅ changes/ directory" || echo "    ⚠️  changes/ directory missing"
          test -f .openspec/.gitignore && echo "    ✅ .gitignore" || echo "    ⚠️  .gitignore missing"
          
          # Check server submodule
          echo "  Server submodule:"
          test -f sogo6-server/.openspec/project.spec.md && echo "    ✅ project.spec.md" || (echo "    ❌ project.spec.md missing" && exit 1)
          test -d sogo6-server/.openspec/specs && echo "    ✅ specs/ directory" || (echo "    ❌ specs/ directory missing" && exit 1)
          test -d sogo6-server/.openspec/changes && echo "    ✅ changes/ directory" || echo "    ⚠️  changes/ directory missing"
          test -f sogo6-server/.openspec/.gitignore && echo "    ✅ .gitignore" || echo "    ⚠️  .gitignore missing"
          
          # Check UI submodule
          echo "  UI submodule:"
          test -f sogo6-ui/.openspec/project.spec.md && echo "    ✅ project.spec.md" || (echo "    ❌ project.spec.md missing" && exit 1)
          test -d sogo6-ui/.openspec/specs && echo "    ✅ specs/ directory" || (echo "    ❌ specs/ directory missing" && exit 1)
          test -d sogo6-ui/.openspec/changes && echo "    ✅ changes/ directory" || echo "    ⚠️  changes/ directory missing"
          test -f sogo6-ui/.openspec/.gitignore && echo "    ✅ .gitignore" || echo "    ⚠️  .gitignore missing"
          
          echo "✅ Structure validation passed"

      - name: Count specification files
        run: |
          echo "📊 Specification file counts:"
          
          ROOT_SPECS=$(find .openspec -name "*.spec.md" 2>/dev/null | wc -l)
          ROOT_CHANGES=$(find .openspec -name "*.change.md" 2>/dev/null | wc -l)
          SERVER_SPECS=$(find sogo6-server/.openspec -name "*.spec.md" 2>/dev/null | wc -l)
          SERVER_CHANGES=$(find sogo6-server/.openspec -name "*.change.md" 2>/dev/null | wc -l)
          UI_SPECS=$(find sogo6-ui/.openspec -name "*.spec.md" 2>/dev/null | wc -l)
          UI_CHANGES=$(find sogo6-ui/.openspec -name "*.change.md" 2>/dev/null | wc -l)
          
          echo "  Root: $ROOT_SPECS specs, $ROOT_CHANGES changes"
          echo "  Server: $SERVER_SPECS specs, $SERVER_CHANGES changes"
          echo "  UI: $UI_SPECS specs, $UI_CHANGES changes"
          
          TOTAL_SPECS=$((ROOT_SPECS + SERVER_SPECS + UI_SPECS))
          TOTAL_CHANGES=$((ROOT_CHANGES + SERVER_CHANGES + UI_CHANGES))
          
          echo "  Total: $TOTAL_SPECS specs, $TOTAL_CHANGES changes"
          
          # Minimum requirements
          if [ $TOTAL_SPECS -lt 10 ]; then
            echo "❌ Not enough spec files (minimum 10 required)"
            exit 1
          fi
          
          echo "✅ Minimum file count requirements met"

      - name: Check for broken links (basic)
        run: |
          echo "🔗 Checking for obvious broken internal links..."
          
          # Check for links to files that should exist
          LINK_ERRORS=0
          
          # Check if INDEX.md exists
          if ! grep -q "INDEX.md" .openspec/specs/INDEX.md 2>/dev/null; then
            echo "  ⚠️  INDEX.md reference check"
          fi
          
          # Check for relative links that point to non-existent files
          for file in $(find .openspec sogo6-server/.openspec sogo6-ui/.openspec -name "*.md" -type f); do
            # Extract relative links (excluding external URLs and anchors)
            LINKS=$(grep -oE '\([^)]+\)' "$file" 2>/dev/null | grep -v '^http' | grep -v '^#' | grep -v '^\.\./\.\./' || true)
            
            for link in $LINKS; do
              CLEAN_LINK=$(echo "$link" | sed 's/[()]//g' | sed 's/^[[:space:]]*//' | sed 's/[[:space:]]*$//')
              
              # Skip if it looks like code
              if echo "$CLEAN_LINK" | grep -qE '^[a-z]+\.[a-z]+$|^[a-z]+/[a-z]+$|^[0-9]+$|^[a-z]+\.[a-z]+/[a-z]+$'; then
                continue
              fi
              
              # Check if file exists
              FILE_DIR=$(dirname "$file")
              if [ ! -f "$FILE_DIR/$CLEAN_LINK" ] && [ ! -f "$CLEAN_LINK" ]; then
                # Only report if it looks like a real file path
                if echo "$CLEAN_LINK" | grep -qE '\.(md|spec\.md|change\.md)$'; then
                  echo "  ⚠️  Possible broken link: $CLEAN_LINK in $file"
                  ((LINK_ERRORS++)) || true
                fi
              fi
            done
          done
          
          if [ $LINK_ERRORS -eq 0 ]; then
            echo "  ✅ No obvious broken file links found"
          else
            echo "  ⚠️  Found $LINK_ERRORS potential broken links"
            echo "  (Manual review recommended)"
          fi

      - name: Run Markdown linting
        run: |
          echo "📝 Running Markdown linter..."
          
          # Run markdownlint with relaxed rules for spec files
          markdownlint .openspec/**/*.md sogo6-server/.openspec/**/*.md sogo6-ui/.openspec/**/*.md \
            --disable MD013 MD033 MD041 \
            --ignore .openspec/specs/FINAL_SUMMARY.md \
            --ignore .openspec/specs/PROGRESS.md \
            --ignore .openspec/specs/INDEX.md \
            2>&1 || true
          
          echo "✅ Markdown linting completed (with relaxed rules)"

      - name: Run spelling check
        run: |
          echo "📖 Running spelling check..."
          
          SPELL_OUTPUT=$(codespell .openspec/ sogo6-server/.openspec/ sogo6-ui/.openspec/ 2>&1 || true)
          
          if [ -z "$SPELL_OUTPUT" ]; then
            echo "  ✅ No spelling errors found"
          else
            echo "  ⚠️  Spelling issues found:"
            echo "$SPELL_OUTPUT" | head -10
            echo "  (Manual review recommended)"
          fi

      - name: Generate validation report
        run: |
          echo "📊 Generating validation report..."
          SPEC_COUNT=$(find .openspec sogo6-server/.openspec sogo6-ui/.openspec -name "*.spec.md" 2>/dev/null | wc -l)
          CHANGE_COUNT=$(find .openspec sogo6-server/.openspec sogo6-ui/.openspec -name "*.change.md" 2>/dev/null | wc -l)
          echo "Total specs: $SPEC_COUNT, Total changes: $CHANGE_COUNT"
          echo "✅ Validation report generated"

      - name: Upload validation report
        uses: actions/upload-artifact@v4
        with:
          name: openspec-validation-report
          path: .openspec/VALIDATION_REPORT.md
          retention-days: 7

  summary:
    name: Validation Summary
    runs-on: ubuntu-latest
    needs: validate
    if: always()
    
    steps:
      - name: Check validation status
        run: |
          if [ "${{ needs.validate.result }}" == "success" ]; then
            echo "🎉 OpenSpec validation PASSED"
            echo ""
            echo "All specification files are properly structured and ready for use."
            echo ""
            echo "Next steps:"
            echo "1. Review any flagged issues in the validation report"
            echo "2. Consider adding more cross-references between specs"
            echo "3. Set up spec-driven development workflow"
            exit 0
          else
            echo "❌ OpenSpec validation FAILED"
            echo ""
            echo "Please review the validation errors and fix them before merging."
            exit 1
          fi
