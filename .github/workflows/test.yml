name: Test

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  COMPOSE_FILE: docker-compose.yaml
  SOGO_API_URL: http://localhost:5001
  SOGO_API_INTERNAL: http://localhost:5000
  SOGO_LDAP_HOST: localhost
  SOGO_SMTP_HOST: localhost
  SOGO_PG_HOST: localhost
  SOGO_REDIS_HOST: localhost

jobs:
  lint:
    name: Lint shell scripts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
      - name: Run shellcheck
        run: shellcheck tests/*.sh sogo6/scripts/*.sh

  ui-build:
    name: UI Build & Test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'true'
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: sogo6-ui/package-lock.json

      - name: Install dependencies
        run: |
          cd sogo6-ui
          npm ci || npm install

      - name: Run UI unit tests
        run: |
          cd sogo6-ui
          npx jest --passWithNoTests --maxWorkers=2

      - name: Build UI
        run: |
          cd sogo6-ui
          npm run build

  test:
    name: Full stack E2E test
    runs-on: ubuntu-24.04
    needs: [lint]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'true'
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            curl openssl python3 python3-pip \
            ldap-utils netcat-openbsd

      - name: Generate secrets
        run: bash sogo6/scripts/manage-secrets.sh

      - name: Generate TLS certs
        run: bash sogo6/scripts/gen-certs.sh

      - name: Build Docker images
        run: |
          docker compose build --parallel
          docker images --filter "reference=sogo6*" --format "{{.Repository}}:{{.Tag}}"

      - name: Start stack
        run: |
          docker compose up -d --wait --wait-timeout 180
          docker compose ps

      - name: Initialize SOGo6
        run: bash sogo6/scripts/init-sogo6.sh

      - name: Wait for readiness
        run: |
          echo "Waiting for API..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:5001/api/user/v1/system >/dev/null 2>&1; then
              echo "API ready after ${i}s"
              break
            fi
            sleep 2
          done

      - name: Run shell test suite
        run: bash tests/run-all-tests.sh

      - name: Run Admin API CRUD E2E tests
        run: bash tests/admin-api-test.sh

      - name: Run Python integration tests
        run: |
          pip3 install -q pytest requests psycopg2-binary
          SOGO_INTEGRATION_TESTS=1 python3 -m pytest tests/integration/ -v --tb=short -x

      - name: Run contract/property-based tests
        run: |
          pip3 install -q hypothesis
          cd sogo6-server && python3 -m pytest tests/test_properties/ -v --tb=short -x

      # ────────────────────────────────────────────────────
      # E2E Frontend Integration Tests (Playwright)
      # ────────────────────────────────────────────────────
      # The containerized UI uses the production standalone build (Dockerfile.prod)
      # which doesn't hydrate React client-side (Next.js 16.2.10 Turbopack issue).
      # For E2E tests we stop the container and run next dev on the host.

      - name: Setup Node.js for Playwright
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright with Chromium
        run: |
          cd tests/e2e
          npm ci || npm install
          npx playwright install chromium

      - name: Run Playwright E2E tests
        run: |
          # Stop the containerized UI (production build — no React hydration)
          echo "Stopping containerized UI..."
          docker compose stop sogo6-ui 2>/dev/null || true
          docker compose rm -f sogo6-ui 2>/dev/null || true

          # Free port 3000
          fuser -k 3000/tcp 2>/dev/null || true
          sleep 2

          # Set env vars for dev mode
          export NODE_ENV=development
          export NEXT_TELEMETRY_DISABLED=1
          export REACT_APP_API_BASE_URL=http://localhost:5001/api/user/v1
          export LOGIN_PREFILL_EMAIL=testuser@example.org
          export LOGIN_PREFILL_PASSWORD=password123

          # Start next dev in the background
          echo "Starting next dev on host..."
          cd sogo6-ui
          npx next dev --port 3000 --hostname 0.0.0.0 &
          NEXT_PID=$!
          cd ..

          # Wait for the dev server to be ready
          echo "Waiting for UI dev server..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/en/auth/login >/dev/null 2>&1; then
              echo "UI dev server ready after ${i}s"
              break
            fi
            sleep 2
          done

          # Use a compose override to provide env to the API tests
          # Actually, the Playwright tests expect port 3000 for UI and 5001 for API
          echo "Running Playwright E2E tests..."

          # Pre-compile known routes to avoid on-demand SSR crashes
          for route in /en/auth/login /en/auth/login/pwd; do
            curl -sf -o /dev/null "http://localhost:3000$route" &
          done
          wait

          cd tests/e2e
          npx playwright test --config=playwright.config.ts --reporter=list,json 2>&1 || true
          cd ../..

          # Stop next dev
          echo "Stopping next dev (PID $NEXT_PID)..."
          kill $NEXT_PID 2>/dev/null || true
          wait $NEXT_PID 2>/dev/null || true

      # ────────────────────────────────────────────────────
      # Load / Performance Tests
      # ────────────────────────────────────────────────────

      - name: Install k6 for load testing
        run: |
          K6_VERSION="0.59.0"
          K6_URL="https://github.com/grafana/k6/releases/download/v${K6_VERSION}/k6-v${K6_VERSION}-linux-amd64.tar.gz"
          curl -sL "$K6_URL" | tar xz -C /tmp
          sudo cp "/tmp/k6-v${K6_VERSION}-linux-amd64/k6" /usr/local/bin/
          k6 version

      - name: Run load tests (JSON output)
        id: load-tests
        continue-on-error: true
        run: |
          echo "Running load/performance test suite..."
          mkdir -p tests/load/results
          
          # Run load tests with JSON summary output
          bash tests/load/run.sh 2>&1 | tee tests/load/results/load-test-output.log
          
          # Copy k6 JSON output if available
          ls tests/load/results/ 2>/dev/null || true
          
          echo "Load test run complete (exit code: $?)"

      - name: Upload load test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: load-test-reports
          path: |
            tests/load/results/
          if-no-files-found: ignore

      # ────────────────────────────────────────────────────
      # Artifacts & Reporting
      # ────────────────────────────────────────────────────

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            tests/test-report-*.json
            tests/e2e/playwright-results.json
            tests/e2e/playwright-report/
            tests/e2e/test-results/
          if-no-files-found: ignore

      - name: Print Docker logs
        if: failure()
        run: |
          for svc in sogo6-ui sogo6-server sogo6-ldap sogo6-stalwart sogo6-postgres sogo6-redis; do
            echo "=== $svc logs ==="
            docker compose logs --tail=50 "$svc" 2>/dev/null || true
          done
