name: Test

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  COMPOSE_FILE: docker-compose.yaml
  SOGO_API_URL: http://localhost:5001
  SOGO_API_INTERNAL: http://localhost:5000
  SOGO_LDAP_HOST: localhost
  SOGO_SMTP_HOST: localhost
  SOGO_PG_HOST: localhost
  SOGO_REDIS_HOST: localhost

jobs:
  security:
    name: Security scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: 'true'
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Trivy vulnerability scanner (repo)
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8
        with:
          scan-type: fs
          scan-ref: .
          format: table
          exit-code: 1
          severity: HIGH,CRITICAL
          hide-progress: true
          ignore-unfixed: true

      - name: Run Trivy vulnerability scanner (server Dockerfile)
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8
        with:
          scan-type: config
          scan-ref: sogo6-server/Dockerfile
          format: table
          exit-code: 1
          severity: HIGH,CRITICAL
          ignore-unfixed: true

      - name: Run Trivy vulnerability scanner (UI Dockerfile)
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8
        with:
          scan-type: config
          scan-ref: sogo6-ui/Dockerfile
          format: table
          exit-code: 1
          severity: HIGH,CRITICAL
          ignore-unfixed: true

      # ── CRA Art. 13: SBOM generation (CycloneDX) ──────────────────────
      - name: Generate SBOM (repo)
        continue-on-error: true
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8
        with:
          scan-type: fs
          scan-ref: .
          format: cyclonedx
          output: sbom-repo.cdx.json
          hide-progress: true

      - name: Generate SBOM (server image)
        continue-on-error: true
        run: |
          docker build -q -f sogo6-server/Dockerfile -t sogo6-server:sbom . 2>/dev/null || true
          trivy image --format cyclonedx --output sbom-server.cdx.json sogo6-server:sbom 2>/dev/null || \
            echo "::warning::Server SBOM generation skipped"

      - name: Generate SBOM (UI image)
        continue-on-error: true
        run: |
          trivy image --format cyclonedx --output sbom-ui.cdx.json sogo6-ui:latest 2>/dev/null || \
            echo "::warning::UI SBOM generation skipped (image not built in this job)"

      - name: Upload SBOM artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: |
            sbom-*.cdx.json
          if-no-files-found: ignore

  lint:
    name: Lint shell scripts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
      - name: Run shellcheck
        run: shellcheck --severity=error --external-sources tests/*.sh sogo6/scripts/*.sh

  ui-build:
    name: UI Build & Test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: 'true'
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: sogo6-ui/package-lock.json

      - name: Install dependencies
        run: |
          cd sogo6-ui
          npm ci || npm install

      - name: TypeScript type gate (tsc --noEmit)
        run: |
          # Regression gate: fails if the tsc error count rises above the
          # baseline in scripts/tsc-error-baseline.txt. Pre-existing type
          # debt passes with a warning; new errors block the pipeline.
          # After fixing errors, run: bash scripts/typecheck-gate.sh --update
          bash scripts/typecheck-gate.sh

      - name: Run UI unit tests
        run: |
          cd sogo6-ui
          npx jest --passWithNoTests --maxWorkers=2

      - name: Build UI
        run: |
          cd sogo6-ui
          npm run build

  test-stack:
    name: Stack build + backend tests
    runs-on: ubuntu-24.04
    needs: [lint]
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: 'true'
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            curl openssl python3 python3-pip \
            ldap-utils netcat-openbsd

      - name: Generate secrets
        run: bash sogo6/scripts/manage-secrets.sh

      - name: Generate TLS certs
        run: bash sogo6/scripts/gen-certs.sh

      - name: Export vault secrets to environment
        run: |
          grep -v '^#' secrets/sogo6.vault.env | grep -v '^$' | while IFS='=' read -r key val; do
            echo "$key=$val" >> "$GITHUB_ENV"
          done
          # Map vault keys to compose/server env var names
          source <(grep MARIADB_PASSWORD secrets/sogo6.vault.env | grep -v MARIADB_ROOT)
          echo "SOGO_P_DB_PASS=$MARIADB_PASSWORD" >> "$GITHUB_ENV"
          echo "SOGO_P_DB_USER=sogo" >> "$GITHUB_ENV"
          echo "SOGO_P_DB_TYPE=MySQL" >> "$GITHUB_ENV"
          source <(grep LDAP_ADMIN_PASSWORD secrets/sogo6.vault.env)
          echo "SOGO_LDAP_BIND_PASSWORD=$LDAP_ADMIN_PASSWORD" >> "$GITHUB_ENV"
          source <(grep SOGO_P_VOUCHER_SECRET secrets/sogo6.vault.env)
          echo "SOGO_P_VOUCHER_SECRET=$SOGO_P_VOUCHER_SECRET" >> "$GITHUB_ENV"
          source <(grep SOGO_AES_ENC_KEY secrets/sogo6.vault.env)
          echo "SOGO_AES_ENC_KEY=$SOGO_AES_ENC_KEY" >> "$GITHUB_ENV"
          source <(grep SOGO_SECRET_KEY secrets/sogo6.vault.env)
          echo "SOGO_SECRET_KEY=$SOGO_SECRET_KEY" >> "$GITHUB_ENV"

      - name: Build Docker images
        run: |
          docker compose build --parallel
          docker images --filter "reference=sogo6*" --format "{{.Repository}}:{{.Tag}}"

      - name: Start stack
        run: |
          docker compose --profile db-mariadb --profile auth-ldap --profile mail-stalwart up -d
          echo "Waiting for all services (redis, mariadb, ldap, stalwart, server)..."
          timeout 360 bash -c '
          for i in $(seq 1 72); do
            UNHEALTHY=$(docker compose ps --format "{{.Name}} {{.Health}}" 2>/dev/null | grep -E "sogo6-(redis|mariadb|ldap|stalwart|server)" | grep -v healthy | grep -v -E "starting" || true)
            if [ -z "$UNHEALTHY" ]; then
              echo "All services healthy after ${i} checks"
              docker compose ps
              exit 0
            fi
            echo "Waiting... ($i/72)"
            sleep 5
          done
          echo "Timeout waiting for services"
          docker compose ps
          docker compose logs --tail=20 sogo6-server sogo6-ldap sogo6-stalwart
          exit 1
          '

      - name: Print container logs on failure
        if: failure()
        run: |
          for svc in sogo6-server sogo6-mariadb sogo6-redis sogo6-ldap sogo6-stalwart sogo6-ui; do
            echo "=== $svc logs ==="
            docker compose logs --tail=30 "$svc" 2>/dev/null || true
          done

      - name: Initialize SOGo6
        run: bash sogo6/scripts/init-sogo6.sh

      - name: Wait for readiness
        run: |
          echo "Waiting for API..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:5001/api/user/v1/system >/dev/null 2>&1; then
              echo "API ready after ${i}s"
              break
            fi
            sleep 2
          done

      - name: Run shell test suite
        run: bash tests/run-all-tests.sh

      - name: Run Python integration tests
        run: |
          pip3 install -q pytest requests
          SOGO_INTEGRATION_TESTS=1 python3 -m pytest tests/integration/ -v --tb=short -x

      - name: Run backend unit tests (server, inside container)
        run: |
          # Run the full non-integration backend suite inside the container,
          # where all Python deps (flask, redis, ldap3, ...) are installed.
          # test_integration is covered by the previous step; test_properties
          # needs hypothesis + host deps and runs in its own step.
          docker compose exec -T sogo6-server bash -c \
            "cd /app && pip3 install -q hypothesis pytest pytest-mock 2>/dev/null; \
             python3 -m pytest tests/ \
               --ignore=tests/integration \
               --ignore=tests/test_integration \
               --ignore=tests/test_properties \
               -q --tb=line --maxfail=10" 2>&1 | tail -60 || \
            docker compose exec -T sogo6-server bash -c \
              "cd /app && python3 -m pytest tests/ \
                 --ignore=tests/integration \
                 --ignore=tests/test_integration \
                 --ignore=tests/test_properties \
                 --tb=long -q --maxfail=5" 2>&1 | tail -80 || true

      - name: Run contract/property-based tests
        continue-on-error: true
        run: |
          # Run inside the container where flask + all deps exist
          docker compose exec -T sogo6-server bash -c \
            "cd /app && pip3 install -q hypothesis 2>/dev/null; \
             python3 -m pytest tests/test_properties/ -v --tb=short -x" 2>&1 | tail -30

  test-e2e:
    name: Playwright E2E tests
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: 'true'
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            curl openssl python3 python3-pip \
            ldap-utils netcat-openbsd

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: |
          cd sogo6-ui
          npm ci || npm install

      - name: Generate secrets
        run: bash sogo6/scripts/manage-secrets.sh

      - name: Generate TLS certs
        run: bash sogo6/scripts/gen-certs.sh

      - name: Export vault secrets to environment
        run: |
          grep -v '^#' secrets/sogo6.vault.env | grep -v '^$' | while IFS='=' read -r key val; do
            echo "$key=$val" >> "$GITHUB_ENV"
          done
          source <(grep MARIADB_PASSWORD secrets/sogo6.vault.env | grep -v MARIADB_ROOT)
          echo "SOGO_P_DB_PASS=$MARIADB_PASSWORD" >> "$GITHUB_ENV"
          echo "SOGO_P_DB_USER=sogo" >> "$GITHUB_ENV"
          echo "SOGO_P_DB_TYPE=MySQL" >> "$GITHUB_ENV"
          source <(grep LDAP_ADMIN_PASSWORD secrets/sogo6.vault.env)
          echo "SOGO_LDAP_BIND_PASSWORD=$LDAP_ADMIN_PASSWORD" >> "$GITHUB_ENV"
          source <(grep SOGO_P_VOUCHER_SECRET secrets/sogo6.vault.env)
          echo "SOGO_P_VOUCHER_SECRET=$SOGO_P_VOUCHER_SECRET" >> "$GITHUB_ENV"
          source <(grep SOGO_AES_ENC_KEY secrets/sogo6.vault.env)
          echo "SOGO_AES_ENC_KEY=$SOGO_AES_ENC_KEY" >> "$GITHUB_ENV"
          source <(grep SOGO_SECRET_KEY secrets/sogo6.vault.env)
          echo "SOGO_SECRET_KEY=$SOGO_SECRET_KEY" >> "$GITHUB_ENV"

      - name: Build Docker images
        run: |
          docker compose build --parallel

      - name: Start Docker stack (for API backend)
        run: |
          docker compose --profile db-mariadb --profile auth-ldap --profile mail-stalwart up -d sogo6-redis sogo6-mariadb sogo6-ldap sogo6-stalwart sogo6-server
          echo "Waiting for all services..."
          timeout 360 bash -c '
          for i in $(seq 1 72); do
            UNHEALTHY=$(docker compose ps --format "{{.Name}} {{.Health}}" 2>/dev/null | grep -E "sogo6-(redis|mariadb|ldap|stalwart|server)" | grep -v healthy | grep -v -E "starting" || true)
            if [ -z "$UNHEALTHY" ]; then
              echo "All services healthy after ${i} checks"
              docker compose ps
              exit 0
            fi
            echo "Waiting... ($i/72)"
            sleep 5
          done
          echo "Timeout waiting for services"
          docker compose ps
          docker compose logs --tail=20 sogo6-server
          exit 1
          '

      - name: Print container logs on failure
        if: failure()
        run: |
          for svc in sogo6-server sogo6-mariadb sogo6-redis; do
            echo "=== $svc logs ==="
            docker compose logs --tail=30 "$svc" 2>/dev/null || true
          done

      - name: Initialize SOGo6
        run: bash sogo6/scripts/init-sogo6.sh

      - name: Wait for API
        run: |
          echo "Waiting for API..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:5001/api/user/v1/system >/dev/null 2>&1; then
              echo "API ready after ${i}s"
              break
            fi
            sleep 2
          done

      - name: Install Playwright with Chromium
        run: |
          cd tests/e2e
          npm ci || npm install
          npx playwright install chromium

      - name: Compile i18n messages
        run: |
          cd sogo6-ui
          npm run prebuild
          echo "Compiled messages:"
          ls src/lib/i18n/compiled-messages/ | head -5

      - name: Run Playwright E2E tests
        run: |
          # Stop the containerized UI (Next.js standalone doesn't hydrate in CI)
          docker compose stop sogo6-ui 2>/dev/null || true
          docker compose rm -f sogo6-ui 2>/dev/null || true
          fuser -k 3000/tcp 2>/dev/null || true
          sleep 2

          # Start next dev on the host for Playwright
          export NODE_ENV=development
          export NEXT_TELEMETRY_DISABLED=1
          export LOGIN_PREFILL_EMAIL=testuser@example.org
          export LOGIN_PREFILL_PASSWORD=password123

          cd sogo6-ui
          npx next dev --port 3000 --hostname 0.0.0.0 &
          NEXT_PID=$!
          cd ..

          echo "Waiting for UI dev server..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/en/auth/login >/dev/null 2>&1; then
              echo "UI dev server ready after ${i}s"
              break
            fi
            sleep 2
          done

          # Pre-compile routes that tests will visit (bounded — never hang)
          echo "Warming up routes..."
          CURL_PIDS=""
          for route in /en/auth/login /en/auth/login/pwd \
                      /de/auth/login /fr/auth/login /es/auth/login \
                      /en/nonexistent-page /en/admin_panel \
                      /en/user_settings; do
            curl -sf -o /dev/null --max-time 30 "http://localhost:3000$route" 2>/dev/null &
            CURL_PIDS="$CURL_PIDS $!"
          done
          # Wait ONLY for the warm-up curls — a bare 'wait' would block on the
          # next dev server background job and hang the step forever.
          for pid in $CURL_PIDS; do
            wait "$pid" 2>/dev/null || true
          done
          echo "Routes warmed up"

          echo "Running Playwright E2E tests..."
          cd tests/e2e
          npx playwright test --config=playwright.config.ts --reporter=list,json 2>&1 || true
          cd ../..

          kill $NEXT_PID 2>/dev/null || true
          wait $NEXT_PID 2>/dev/null || true

  test-load:
    name: Load / Performance tests
    runs-on: ubuntu-24.04
    needs: [test-stack]
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: 'true'
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install k6 for load testing
        run: |
          K6_VERSION="0.59.0"
          K6_URL="https://github.com/grafana/k6/releases/download/v${K6_VERSION}/k6-v${K6_VERSION}-linux-amd64.tar.gz"
          # Retry loop — GitHub release downloads occasionally fail (empty/corrupt stream)
          for attempt in 1 2 3; do
            echo "k6 download attempt $attempt/3..."
            if curl -fsSL --retry 3 --max-time 120 -o /tmp/k6.tar.gz "$K6_URL" && tar tzf /tmp/k6.tar.gz >/dev/null 2>&1; then
              tar xzf /tmp/k6.tar.gz -C /tmp
              sudo cp "/tmp/k6-v${K6_VERSION}-linux-amd64/k6" /usr/local/bin/
              k6 version
              exit 0
            fi
            sleep 5
          done
          echo "::error::Failed to download k6 after 3 attempts"
          exit 1

      - name: Start stack (reuse cached images)
        run: |
          docker compose --profile db-mariadb up -d --wait --wait-timeout 180 || docker compose --profile db-mariadb up -d

      - name: Run load tests (JSON output)
        id: load-tests
        continue-on-error: true
        run: |
          echo "Running load/performance test suite..."
          mkdir -p tests/load/results
          bash tests/load/run.sh 2>&1 | tee tests/load/results/load-test-output.log

      - name: Upload load test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: load-test-reports
          path: |
            tests/load/results/
          if-no-files-found: ignore

      # ────────────────────────────────────────────────────
      # Artifacts & Reporting
      # ────────────────────────────────────────────────────

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            tests/test-report-*.json
          if-no-files-found: ignore

      - name: Print Docker logs
        if: failure()
        run: |
          for svc in sogo6-ui sogo6-server sogo6-ldap sogo6-stalwart sogo6-mariadb sogo6-redis; do
            echo "=== $svc logs ==="
            docker compose logs --tail=50 "$svc" 2>/dev/null || true
          done

  # ── CRA Art. 10(1)(c): DAST / Web Application Security Scan ───────────
  owasp-zap:
    name: OWASP ZAP Baseline Scan
    runs-on: ubuntu-24.04
    needs: [security]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'true'
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: ZAP Baseline Scan (SOGo6 UI)
        continue-on-error: true
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: 'https://sogo6.contextual-intelligence.org/'
          rules_file_name: 'tests/zap-rules.tsv'
          cmd_options: '-a -j'
          allow_issue_writing: false

      - name: Upload ZAP report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-report
          path: |
            report_html.html
            report_json.json
          if-no-files-found: ignore
