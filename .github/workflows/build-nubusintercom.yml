# SPDX-License-Identifier: AGPL-3.0-only
# Build the nubusintercom (OIDC token exchange proxy) image and publish to GHCR.
# Source: sogo6/nubusintercom/Dockerfile (minimal Flask app, port 8100).
# Pushed as sogo6-server:nubusintercom to match the existing deployment ref.
# Uses a local self-hosted runner (labels: self-hosted, linux, x64, docker).
name: build-nubusintercom

on:
  push:
    branches: [main]
    paths:
      - "sogo6/nubusintercom/**"
      - ".github/workflows/build-nubusintercom.yml"
    tags: ["nubusintercom"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: tobias-weiss-ai-xr/umr/opendesk-edu/opendesk-nix/sogo6-nubusintercom

jobs:
  build:
    runs-on: [self-hosted, linux, x64, docker]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag
            type=ref,event=branch
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: sogo6/nubusintercom
          file: sogo6/nubusintercom/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
