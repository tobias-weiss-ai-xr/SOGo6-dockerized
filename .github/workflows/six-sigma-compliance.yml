name: Six Sigma Compliance Check

on:
  push:
    branches: [main, dev]
    paths:
      - 'sogo6-server/app/**'
      - 'sogo6-server/.openspec/**'
      - 'sogo6-server/scripts/check_spec_compliance.py'
      - '.github/workflows/six-sigma-compliance.yml'
  pull_request:
    branches: [main, dev]
    paths:
      - 'sogo6-server/app/**'
      - 'sogo6-server/.openspec/**'
      - 'sogo6-server/scripts/check_spec_compliance.py'
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:
    inputs:
      generate-report:
        description: 'Generate full compliance report'
        required: false
        default: 'false'

jobs:
  compliance-check:
    name: Six Sigma Compliance Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'sogo6-server/requirements*.txt'

      - name: Install dependencies
        run: |
          cd sogo6-server
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt
          elif [ -f requirements.txt ]; then pip install -r requirements.txt
          fi
          pip install pyyaml

      - name: Run Compliance Checker
        id: compliance
        run: |
          cd sogo6-server
          python scripts/check_spec_compliance.py --all --json > compliance_results.json 2>&1 || true
          python scripts/check_spec_compliance.py --all --markdown > compliance_report.md 2>&1 || true
          python3 ../../scripts/parse-compliance.py compliance_results.json 2>&1 | tee compliance_output.txt || true
          mkdir -p ../../.github/badges
          cp -f compliance_summary.txt ../../.github/badges/compliance.txt 2>/dev/null || true

      - name: Check Compliance Threshold (Main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        run: |
          COMPLIANCE="${{ steps.compliance.outputs.compliance }}"
          echo "Compliance: ${COMPLIANCE}%"
          echo "::notice title=Six Sigma Update::Compliance: ${COMPLIANCE}%, Sigma: ${{ steps.compliance.outputs.sigma }}"

      - name: Upload Compliance Report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: six-sigma-compliance-report
          path: |
            sogo6-server/compliance_results.json
            sogo6-server/compliance_report.md
            sogo6-server/compliance_output.txt
            sogo6-server/compliance_summary.txt
          retention-days: 30
          if-no-files-found: ignore

  compliance-dashboard:
    name: Generate Compliance Dashboard
    runs-on: ubuntu-latest
    needs: compliance-check
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          cd sogo6-server
          pip install -r requirements-dev.txt 2>/dev/null || true
          pip install pyyaml

      - name: Download Compliance Report
        uses: actions/download-artifact@v4
        with:
          name: six-sigma-compliance-report
          path: sogo6-server

      - name: Generate Dashboard
        run: |
          DATE="$(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          cat > sogo6-server/.openspec/specs/COMPLIANCE_DASHBOARD.md << DASH
          # Six Sigma Compliance Dashboard
          **Generated**: ${DATE}
          **Target**: 100% Compliance (6.0 sigma)
          DASH
          echo "Dashboard placeholder created"
