name: Six Sigma Compliance Check

---
# Six Sigma Compliance Workflow for OpenSpec Implementations
# 
# This workflow validates that all implementations meet their specifications
# and tracks progress towards 6 Sigma (100%) compliance.
#
# Sigma Levels:
# - 6.0σ = 100% compliance (3.4 defects per million)
# - 5.0σ = 99.98% compliance (233 defects per million)
# - 4.0σ = 99.38% compliance (6,210 defects per million)
# - 3.0σ = 93.32% compliance (66,807 defects per million)
#
# Current Target: 6.0σ (100% compliance) for all Tier 0 features

on:
  # Run on every push to main and dev
  push:
    branches: [main, dev]
    paths:
      - 'sogo6-server/app/**'
      - 'sogo6-server/.openspec/**'
      - 'sogo6-server/scripts/check_spec_compliance.py'
      - '.github/workflows/six-sigma-compliance.yml'
  
  # Run on pull requests
  pull_request:
    branches: [main, dev]
    paths:
      - 'sogo6-server/app/**'
      - 'sogo6-server/.openspec/**'
      - 'sogo6-server/scripts/check_spec_compliance.py'
  
  # Run weekly on Mondays at 9 AM UTC
  schedule:
    - cron: '0 9 * * 1'
  
  # Allow manual triggering
  workflow_dispatch:
    inputs:
      generate-report:
        description: 'Generate full compliance report'
        required: false
        default: 'false'

---

jobs:
  compliance-check:
    name: Six Sigma Compliance Validation
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        python-version: ['3.11']
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0  # Needed for git history
      
      - name: ✍️ Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: 'sogo6-server/requirements*.txt'
      
      - name: 📦 Install Python dependencies
        run: |
          cd sogo6-server
          if [ -f requirements-dev.txt ]; then
            pip install -r requirements-dev.txt
          elif [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi
          pip install pyyaml  # For potential YAML parsing in scripts
      
      - name: 🔍 Run Compliance Checker
        id: compliance
        run: |
          cd sogo6-server
          
          # Run compliance check for all features
          python scripts/check_spec_compliance.py --all --json > compliance_results.json
          
          # Also generate markdown report
          python scripts/check_spec_compliance.py --all --markdown > compliance_report.md
          
          # Parse results to get metrics
          cat compliance_results.json | python3 -c "
import json, os, sys

data = json.load(sys.stdin)

# Calculate overall metrics
total_compliance = sum(r['compliance_percentage'] for r in data) / len(data) if data else 0
total_dpmo = sum(r['dpmo'] for r in data) / len(data) if data else 0
total_sigma = sum(r['sigma_level'] for r in data) / len(data) if data else 0
features_100 = sum(1 for r in data if r['compliance_percentage'] >= 100)
features_total = len(data)

# Output for GitHub
with open(os.environ.get('GITHUB_OUTPUT', '/dev/null'), 'a') as f:
    f.write(f'compliance={total_compliance:.2f}\n')
    f.write(f'dpmo={total_dpmo:.0f}\n')
    f.write(f'sigma={total_sigma:.2f}\n')
    f.write(f'features_100={features_100}\n')
    f.write(f'features_total={features_total}\n')

# Output summary
print(f'\\n========== SIX SIGMA COMPLIANCE SUMMARY ==========')
print(f'Overall Compliance: {total_compliance:.1f}%')
print(f'Average DPMO: {total_dpmo:,.0f}')
print(f'Average Sigma: {total_sigma:.2f}σ')
print(f'Features at 100%: {features_100}/{features_total}')
print('=' * 50)

# Save summary
with open('compliance_summary.txt', 'w') as f:
    f.write(f'Compliance: {total_compliance:.1f}%, DPMO: {total_dpmo:,.0f}, Sigma: {total_sigma:.2f}σ, 100% Features: {features_100}/{features_total}')
" 2>&1 | tee compliance_output.txt
          
          # Also create a simple badge data file
          echo "$(cat compliance_summary.txt)" > .github/badges/compliance.txt || mkdir -p .github/badges && echo "$(cat compliance_summary.txt)" > .github/badges/compliance.txt
      
      - name: 💬 Post PR Comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            
            // Read markdown report
            let report = '';
            try {
              report = fs.readFileSync('sogo6-server/compliance_report.md', 'utf8');
            } catch (e) {
              report = 'Could not generate compliance report';
            }
            
            // Get outputs
            const compliance = '${{ steps.compliance.outputs.compliance }}';
            const dpmo = '${{ steps.compliance.outputs.dpmo }}';
            const sigma = '${{ steps.compliance.outputs.sigma }}';
            const features100 = '${{ steps.compliance.outputs.features_100 }}';
            const featuresTotal = '${{ steps.compliance.outputs.features_total }}';
            
            // Create comment
            const comment = `
## 🎯 Six Sigma Compliance Check

**Status**: 
- Overall Compliance: **${compliance}%**
- Average DPMO: **${dpmo}**
- Average Sigma Level: **${sigma}σ**
- Features at 100%: **${features100}/${featuresTotal}**

${report}

---

*This is an automated compliance check using Six Sigma methodology.*
`;
            
            // Post comment
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
      
      - name: 🎯 Check Compliance Threshold (Main Branch)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          MIN_COMPLIANCE=70
          ACTUAL_COMPLIANCE=${{ steps.compliance.outputs.compliance }}
          
          echo "Current compliance: ${ACTUAL_COMPLIANCE}%"
          echo "Minimum threshold: ${MIN_COMPLIANCE}%"
          
          if (( $(echo "$ACTUAL_COMPLIANCE < $MIN_COMPLIANCE" | bc -l) )); then
            echo "::error title=Six Sigma Compliance Check Failed::Compliance too low: ${ACTUAL_COMPLIANCE}% (< ${MIN_COMPLIANCE}% threshold)"
            echo "::error::Six Sigma quality standard not met. Please improve compliance before merging to main."
            exit 1
          else
            echo "✅ Compliance check passed (${ACTUAL_COMPLIANCE}% >= ${MIN_COMPLIANCE}%)"
          fi
      
      - name: 🎯 Check Compliance Threshold (Dev Branch)
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
        run: |
          MIN_COMPLIANCE=50
          ACTUAL_COMPLIANCE=${{ steps.compliance.outputs.compliance }}
          
          echo "Current compliance: ${ACTUAL_COMPLIANCE}%"
          echo "Minimum threshold: ${MIN_COMPLIANCE}%"
          
          if (( $(echo "$ACTUAL_COMPLIANCE < $MIN_COMPLIANCE" | bc -l) )); then
            echo "::warning title=Six Sigma Compliance Warning::Compliance below recommended: ${ACTUAL_COMPLIANCE}% (< ${MIN_COMPLIANCE}% threshold)"
            echo "::warning::Consider improving compliance to meet quality standards."
          else
            echo "✅ Compliance check passed (${ACTUAL_COMPLIANCE}% >= ${MIN_COMPLIANCE}%)"
          fi
      
      - name: 📊 Generate Compliance Badge
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')
        run: |
          # Create SVG badge
          COMPLIANCE=${{ steps.compliance.outputs.compliance }}
          SIGMA=${{ steps.compliance.outputs.sigma }}
          
          # Get color based on sigma level
          if (( $(echo "$SIGMA >= 5" | bc -l) )); then
            COLOR="brightgreen"
          elif (( $(echo "$SIGMA >= 4" | bc -l) )); then
            COLOR="green"
          elif (( $(echo "$SIGMA >= 3" | bc -l) )); then
            COLOR="yellow"
          elif (( $(echo "$SIGMA >= 2" | bc -l) )); then
            COLOR="orange"
          else
            COLOR="red"
          fi
          
          # Create badge SVG
          cat > .github/badges/six-sigma-compliance.svg << EOF
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="120" height="20">
  <linearGradient id="b" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" style="stop-color:#555;stop-opacity:1" />
    <stop offset="100%" style="stop-color:#555;stop-opacity:1" />
  </linearGradient>
  <rect width="60" height="20" fill="#555" rx="3"></rect>
  <rect x="60" width="60" height="20" fill="#$COLOR" rx="3"></rect>
  <text x="30" y="14" font-family="Verdana,Geneva,DejaVu Sans,sans-serif" font-size="11" text-anchor="middle" fill="#fff">compliance</text>
  <text x="90" y="14" font-family="Verdana,Geneva,DejaVu Sans,sans-serif" font-size="11" text-anchor="middle" fill="#fff">${{ steps.compliance.outputs.compliance }}%</text>
</svg>
EOF
          
          # Also create sigma badge
          cat > .github/badges/six-sigma-badge.svg << EOF
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="100" height="20">
  <linearGradient id="b" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" style="stop-color:#555;stop-opacity:1" />
    <stop offset="100%" style="stop-color:#555;stop-opacity:1" />
  </linearGradient>
  <rect width="50" height="20" fill="#555" rx="3"></rect>
  <rect x="50" width="50" height="20" fill="#$COLOR" rx="3"></rect>
  <text x="25" y="14" font-family="Verdana,Geneva,DejaVu Sans,sans-serif" font-size="11" text-anchor="middle" fill="#fff">sigma</text>
  <text x="75" y="14" font-family="Verdana,Geneva,DejaVu Sans,sans-serif" font-size="11" text-anchor="middle" fill="#fff">${SIGMA}σ</text>
</svg>
EOF
          
          echo "✅ Badges generated"
      
      - name: 💾 Upload Compliance Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: six-sigma-compliance-report
          path: |
            sogo6-server/compliance_results.json
            sogo6-server/compliance_report.md
            sogo6-server/compliance_output.txt
            sogo6-server/compliance_summary.txt
            .github/badges/
          retention-days: 30
      
      - name: 📈 Commit Badge Updates
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')
        run: |
          cd .github/badges
          git config --global user.name "SOGo6 Six Sigma Bot"
          git config --global user.email "six-sigma@sogo6.local"
          
          # Add and commit badge files
          git add six-sigma-compliance.svg six-sigma-badge.svg compliance.txt
          
          # Check if there are changes
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "chore: Update Six Sigma compliance badges [skip ci]"
            git push
            echo "✅ Badges committed and pushed"
          else
            echo "⚠️ No badge changes to commit"
          fi
      
      - name: 📢 Slack Notification (Optional)
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')
        run: |
          # This would be configured with actual Slack webhook
          # For now, just log the message
          echo "::notice title=Six Sigma Update::Compliance: ${{ steps.compliance.outputs.compliance }}%, Sigma: ${{ steps.compliance.outputs.sigma }}σ"
          
          # Example Slack message (would use actions/github-script with slack API)
          cat << EOF > slack_message.json
          {
            "text": "🎯 Six Sigma Compliance Update",
            "attachments": [
              {
                "color": "#439FE0",
                "fields": [
                  {
                    "title": "Overall Compliance",
                    "value": "${{ steps.compliance.outputs.compliance }}%",
                    "short": true
                  },
                  {
                    "title": "Sigma Level",
                    "value": "${{ steps.compliance.outputs.sigma }}σ",
                    "short": true
                  },
                  {
                    "title": "Features at 100%",
                    "value": "${{ steps.compliance.outputs.features_100 }}/${{ steps.compliance.outputs.features_total }}",
                    "short": true
                  }
                ],
                "footer": "SOGo6 Six Sigma Compliance Bot"
              }
            ]
          }
          EOF
          
          echo "Slack message prepared (webhook not configured)"

  compliance-dashboard:
    name: Generate Compliance Dashboard
    runs-on: ubuntu-latest
    needs: compliance-check
    
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
      
      - name: ✍️ Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: 📦 Install dependencies
        run: |
          cd sogo6-server
          pip install -r requirements-dev.txt 2>/dev/null || echo "No requirements-dev.txt"
          pip install pyyaml
      
      - name: 📊 Download Compliance Report
        uses: actions/download-artifact@v4
        with:
          name: six-sigma-compliance-report
          path: sogo6-server
      
      - name: 📈 Generate Historical Dashboard
        run: |
          # Create dashboard file
          cat > sogo6-server/.openspec/specs/COMPLIANCE_DASHBOARD.md << 'DASHBOARD_EOF'
