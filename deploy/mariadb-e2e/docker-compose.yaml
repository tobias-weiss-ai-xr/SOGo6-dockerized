# MariaDB E2E Test Deployment - vhrz2392
# Purpose: Test MariaDB adapter end-to-end
# 
# Usage:
#   cd deploy/mariadb-e2e
#   docker compose up -d
#   bash run-e2e-tests.sh

version: "3.8"

services:
  # ── MariaDB Database ──────────────────────────────────────────
  mariadb:
    image: mariadb:11
    container_name: mariadb-e2e-mariadb
    environment:
      MYSQL_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
      MYSQL_USER: ${MARIADB_USER}
      MYSQL_PASSWORD: ${MARIADB_PASSWORD}
      MYSQL_DATABASE: ${MARIADB_DATABASE}
    networks:
      - mariadb-e2e-net
    volumes:
      - mariadb-data:/var/lib/mysql
    ports:
      - "${MARIADB_PORT:-33060}:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s

  # ── Redis Cache ───────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: mariadb-e2e-redis
    networks:
      - mariadb-e2e-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── OpenLDAP ──────────────────────────────────────────────────
  ldap:
    image: osixia/openldap:1.5.0
    container_name: mariadb-e2e-ldap
    environment:
      LDAP_ORGANISATION: "Vhrz2392 Test"
      LDAP_DOMAIN: "vhrz2392.test.local"
      LDAP_ADMIN_PASSWORD: ${LDAP_ADMIN_PASSWORD}
    networks:
      - mariadb-e2e-net
    volumes:
      - ldap-data:/var/lib/ldap
      - ldap-config:/etc/ldap/slapd.d
    healthcheck:
      test: ["CMD", "ldapsearch", "-x", "-H", "ldap://localhost", "-b", "dc=vhrz2392,dc=test,dc=local", "-D", "cn=admin,dc=vhrz2392,dc=test,dc=local", "-w", "${LDAP_ADMIN_PASSWORD}", "(objectClass=*)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ── SOGo Backend (MariaDB) ────────────────────────────────────
  server:
    build:
      context: ../../sogo6-server
      dockerfile: deploy/local/Dockerfile.local
      target: development
    container_name: mariadb-e2e-server
    environment:
      FLASK_ENV: ${NODE_ENV:-production}
      SOGO_DB_URI: mysql+pymysql://${MARIADB_USER}:${MARIADB_PASSWORD}@mariadb:3306/${MARIADB_DATABASE}
      SOGO_REDIS_URI: redis://redis:6379/0
      SOGO_LDAP_URI: ldap://ldap:389
      SOGO_LDAP_BASE_DN: ${LDAP_BASE_DN}
      SOGO_LDAP_BIND_DN: ${LDAP_BIND_DN}
      SOGO_LDAP_BIND_PASSWORD: ${LDAP_ADMIN_PASSWORD}
      SCIM_BEARER_TOKEN: ${SCIM_BEARER_TOKEN}
      INTERCOM_SHARED_SECRET: ${INTERCOM_SHARED_SECRET}
      SOGO_LOG_LEVEL: ${SOGO_LOG_LEVEL}
      SOGO_JSON_LOG: ${SOGO_JSON_LOG}
      # Required for ProcessSetting validation
      SOGO_P_REDIS_URL: redis://redis:6379/0
      SOGO_P_VOUCHER_SECRET: ${INTERCOM_SHARED_SECRET:-test_voucher_secret}
      SOGO_AES_ENC_KEY: ${INTERCOM_SHARED_SECRET:-test_aes_enc_key}
      SOGO_P_DB_TYPE: MySQL
      SOGO_P_DB_USER: ${MARIADB_USER}
      SOGO_P_DB_PASS: ${MARIADB_PASSWORD}
      SOGO_P_DB_HOST: mariadb
      SOGO_P_DB_PORT: 3306
      SOGO_P_DB_ENC: utf8mb4
    networks:
      - mariadb-e2e-net
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
      ldap:
        condition: service_healthy
    ports:
      - "${API_PORT:-5001}:5000"
    volumes:
      - logs:/var/log/sogo

  # ── SOGo Frontend ─────────────────────────────────────────────
  ui:
    build:
      context: ../../sogo6-ui
      dockerfile: Dockerfile.prod
      target: runner
    container_name: mariadb-e2e-ui
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      NEXT_TELEMETRY_DISABLED: 1
      HOSTNAME: 0.0.0.0
    networks:
      - mariadb-e2e-net
    depends_on:
      - server
    ports:
      - "${UI_PORT:-30000}:3000"

networks:
  mariadb-e2e-net:
    driver: bridge

volumes:
  mariadb-data:
  ldap-data:
  ldap-config:
  logs:
