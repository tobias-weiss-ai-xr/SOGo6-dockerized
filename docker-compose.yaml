# SOGo 6 — Docker Compose
# =======================
#
# Choose your database backend using profiles:
#
#   # MariaDB (MySQL) - Default
#   docker compose --profile mail-stalwart --profile auth-ldap up -d
#
#   # PostgreSQL instead of MariaDB
#   docker compose --profile mail-stalwart --profile db-postgres --profile auth-ldap up -d
#
# Minimal setup (bring your own DB, mail, auth):
#   docker compose up -d
#
# All environment variables have sensible defaults. Override via .env file.

name: sogo6

# ────────────────────────────────────────────────────────────
# CORE — always started, minimal footprint
# ────────────────────────────────────────────────────────────

services:
  # SOGo UI — Next.js frontend
  sogo6-ui:
    image: sogo6-ui:latest
    restart: unless-stopped
    container_name: sogo6-ui
    build:
      context: ./sogo6-ui
      dockerfile: Dockerfile.prod
    environment:
      # Internal URL used by server-side routes; overridden at runtime
      # by NEXT_PUBLIC_API_BASE_URL when set (see env-route-payload.ts).
      REACT_APP_API_BASE_URL: http://sogo6-server:5000/api/user/v1
      # Public URL for browser-facing deployments (reverse proxy).
      # When set, /env returns this + '/api/user/v1' instead of the internal URL.
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-}
      NEXT_PUBLIC_ADMIN_DOMAINS: ${NEXT_PUBLIC_ADMIN_DOMAINS:-admin.localhost}
      SSE_ENABLED: "${SSE_ENABLED:-true}"
      HOSTNAME: 0.0.0.0
    ports:
      - "${UI_PORT:-3000}:3000"
    networks:
      - sogo6-net
    depends_on:
      sogo6-server:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "2.0"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000/env || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # SOGo API Server — Flask backend (MariaDB default)
  sogo6-server:
    image: sogo6-server:dev
    restart: unless-stopped
    container_name: sogo6-server
    build:
      context: ./sogo6-server
      dockerfile: deploy/local/Dockerfile.local
      target: development
    environment:
      FLASK_ENV: ${FLASK_ENV:-development}
      # Database credentials — override process.conf when set via environment
      SOGO_P_DB_PASS: ${SOGO_P_DB_PASS:-}
      SOGO_P_DB_USER: ${SOGO_P_DB_USER:-sogo}
      SOGO_P_DB_TYPE: ${SOGO_P_DB_TYPE:-MySQL}
      SOGO_REDIS_URI: redis://sogo6-redis:6379/0
      SOGO_LDAP_URI: ${SOGO_LDAP_URI:-ldap://sogo6-ldap:389}
      # These must match sogo6-ldap's LDAP_BASE_DN/LDAP_BIND_DN (see the ldap
      # service below). Both default to dc=example,dc=org so that fresh/CI
      # boot (LDAP_DOMAIN=example.org) has a consistent tree. Deployments with a
      # production domain set SOGO_LDAP_BASE_DN + SOGO_LDAP_BIND_DN explicitly.
      SOGO_LDAP_BASE_DN: ${SOGO_LDAP_BASE_DN:-dc=example,dc=org}
      SOGO_LDAP_BIND_DN: ${SOGO_LDAP_BIND_DN:-cn=admin,dc=example,dc=org}
      SOGO_LDAP_BIND_PASSWORD: ${SOGO_LDAP_BIND_PASSWORD:-}
      SOGO_SMTP_SERVER: ${SOGO_SMTP_SERVER:-sogo6-stalwart}
      SOGO_SMTP_PORT: ${SOGO_SMTP_PORT:-20025}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SOGO_LOG_LEVEL: ${SOGO_LOG_LEVEL:-info}
      SOGO_JSON_LOG: ${SOGO_JSON_LOG:-1}
      SOGO_LOG_DIR: ${SOGO_LOG_DIR:-/var/log/sogo}
      SOGO_PROPAGATE_REQUEST_ID: ${SOGO_PROPAGATE_REQUEST_ID:-0}
      SOGO_INIT_SYSTEM_SETTINGS_PATH: /etc/sogo/init/system_settings.json
      SOGO_INIT_DOMAIN_SETTINGS_PATH: /etc/sogo/init/domain_settings.json
      SOGO_P_VOUCHER_SECRET: ${SOGO_P_VOUCHER_SECRET:-}
      SOGO_AES_ENC_KEY: ${SOGO_AES_ENC_KEY:-}
      SOGO_SECRET_KEY: ${SOGO_SECRET_KEY:-}
      # Admin API password — CRA Art. 15: server refuses to start if empty/default
      SOGO_P_ADMIN_PWD: ${SOGO_P_ADMIN_PWD:-}
      # SCIM bearer token — gates /scim/v2/* (SCIM's own token; empty disables)
      SCIM_BEARER_TOKEN: ${SCIM_BEARER_TOKEN:-}
      # ── SAML2 SP keypair ───────────────────────────────────────────────────
      # Mount sp-cert.pem and sp-key.pem at /etc/sogo/saml/ for SAML2 SSO.
      # Generate with: openssl req -x509 -newkey rsa:2048 -keyout sp-key.pem \
      #   -out sp-cert.pem -days 3650 -nodes -subj "/CN=sogo-sp"
      SOGO_SAML2_SP_CERT_FILE: ${SOGO_SAML2_SP_CERT_FILE:-/etc/sogo/saml/sp-cert.pem}
      SOGO_SAML2_SP_KEY_FILE: ${SOGO_SAML2_SP_KEY_FILE:-/etc/sogo/saml/sp-key.pem}
      SOGO_SAML2_METADATA_CACHE_TTL: ${SOGO_SAML2_METADATA_CACHE_TTL:-21600}
      SOGO_SAML2_CLOCK_SKEW: ${SOGO_SAML2_CLOCK_SKEW:-60}
    volumes:
      - ./sogo6/config/process.conf:/etc/sogo/process.conf:ro
      - ./sogo6/config/init:/etc/sogo/init:ro
      - ./sogo6-server:/app:cached  # macOS Docker Desktop uses :cached; on Linux this is ignored
      - sogo6-logs:/var/log/sogo
      # SAML2 SP keypair (cert + private key for signing AuthnRequests and decrypting assertions)
      - ./sogo6/saml:/etc/sogo/saml:ro
    ports:
      - "${API_PORT:-5001}:5000"
    networks:
      - sogo6-net
    depends_on:
      sogo6-redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 2048M
          cpus: "2.0"
    healthcheck:
      test: ["CMD-SHELL", "curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:5000/api/user/v1/health | grep -qE '^(200|503)$'"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
      # Note: healthcheck succeeds even without a database if the API process is running.
      # A running database is required for most API operations.

  # Redis — session cache + Celery broker
  sogo6-redis:
    image: redis:7-alpine
    restart: unless-stopped
    container_name: sogo6-redis
    networks:
      - sogo6-net
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # PostgreSQL database-specific server configuration (overrides sogo6-server when db-postgres profile is enabled)
  # Nginx — reverse proxy + TLS termination
  sogo6-nginx:
    profiles: ["nginx"]
    image: nginx:alpine
    restart: unless-stopped
    container_name: sogo6-nginx
    volumes:
      - ./sogo6/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./sogo6/nginx/certs:/etc/nginx/certs:ro
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    networks:
      - sogo6-net
    depends_on:
      - sogo6-ui
      - sogo6-server
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 64M
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 5s
      retries: 3

# ────────────────────────────────────────────────────────────
# INFRASTRUCTURE — pick what you need via profiles
# ────────────────────────────────────────────────────────────

  # OpenLDAP — user directory / authentication
  sogo6-ldap:
    profiles: ["auth-ldap"]
    image: sogo6-ldap:latest
    restart: unless-stopped
    build:
      context: ./sogo6/ldap
      dockerfile: Dockerfile
    container_name: sogo6-ldap
    environment:
      LDAP_ORGANISATION: ${LDAP_ORGANISATION:-Example Org}
      LDAP_DOMAIN: ${LDAP_DOMAIN:-example.org}
      # Base DN defaults to dc=example,dc=org — consistent with LDAP_DOMAIN
      # (example.org) and the seed LDIF. The old default pointed at the PROD DN
      # (dc=sogo6,dc=contextual-intelligence,dc=org); with LDAP_DOMAIN=example.org
      # it made slapd seed into a non-existent parent, so the container
      # crash-looped and every LDAP bind failed in fresh (CI) environments.
      # Deployments using a production domain set LDAP_DOMAIN + LDAP_BASE_DN
      # explicitly and are unaffected.
      LDAP_BASE_DN: ${LDAP_BASE_DN:-dc=example,dc=org}
      # ⚠️  Change these in production — generate strong passwords and set via env
      LDAP_ADMIN_PASSWORD: ${LDAP_ADMIN_PASSWORD:-}
      LDAP_CONFIG_PASSWORD: ${LDAP_CONFIG_PASSWORD:-}
      LDAP_SEED_INTERNAL_LDIF_PATH: /ldif-seed
    volumes:
      - sogo6-ldap-data:/var/lib/ldap
      - sogo6-ldap-config:/etc/ldap/slapd.d
      - ./sogo6/ldap/init.ldif:/ldif-seed/00-init.ldif
    ports:
      - "${LDAP_PORT:-389}:389"
    networks:
      - sogo6-net
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M
    healthcheck:
      # Use a wrapper that falls back to anonymous bind when no admin password is set
      test: ["CMD-SHELL", "PASS=${LDAP_ADMIN_PASSWORD}; ldapsearch -x -H ldap://localhost:389 -b ${LDAP_BASE_DN:-dc=example,dc=org} ${PASS:+-D cn=admin,${LDAP_BASE_DN:-dc=example,dc=org} -w $PASS} -s base 2>/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  # PostgreSQL — application database (alternative to MariaDB)
  sogo6-postgres:
    profiles: ["db-postgres"]
    image: postgres:15-alpine
    restart: unless-stopped
    container_name: sogo6-postgres
    environment:
      POSTGRES_USER: ${PG_USER:-sogo}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-}
      POSTGRES_DB: ${PG_DATABASE:-sogo}
      # Stalwart database will be created by init script below
      POSTGRES_HOST_AUTH_METHOD: ${PG_AUTH_METHOD:-scram-sha-256}
    volumes:
      - sogo6-postgres-data:/var/lib/postgresql/data
    ports:
      - "${PG_PORT:-5432}:5432"
    networks:
      - sogo6-net
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-sogo}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # MariaDB — application database (default)
  sogo6-mariadb:
    profiles: ["db-mariadb"]
    image: mariadb:11
    restart: unless-stopped
    container_name: sogo6-mariadb
    environment:
      # ⚠️  Change in production — set MARIADB_ROOT_PASSWORD / MARIADB_PASSWORD
      MYSQL_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-}
      MYSQL_USER: ${MARIADB_USER:-sogo}
      MYSQL_PASSWORD: ${MARIADB_PASSWORD:-}
      MYSQL_DATABASE: ${MARIADB_DATABASE:-sogo}
    volumes:
      - sogo6-mariadb-data:/var/lib/mysql
      - ./sogo6/mariadb/my.cnf:/etc/mysql/conf.d/my.cnf:ro
    ports:
      - "${MARIADB_PORT:-3306}:3306"
    networks:
      - sogo6-net
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 256M
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Stalwart — IMAP + SMTP + Sieve mail server
  sogo6-stalwart:
    profiles: ["mail-stalwart"]
    image: stalwartlabs/stalwart:${STALWART_VERSION:-latest}
    restart: unless-stopped
    container_name: sogo6-stalwart
    depends_on:
      sogo6-redis:
        condition: service_healthy
    environment:
      STALWART_RECOVERY_ADMIN: admin:${STALWART_SECRET:-eval_admin_2026}
      STALWART_HOSTNAME: mail.${LDAP_DOMAIN:-example.org}
      # ⚠️  Change in production — set STALWART_DB_PASSWORD env var
      STALWART_DB_PASSWORD: ${STALWART_DB_PASSWORD:-}
      # LDAP admin password (vault) — used by Stalwart to bind to the directory
      LDAP_ADMIN_PASSWORD: ${LDAP_ADMIN_PASSWORD:-}
      # Outbound relay credentials for tobias-weiss.org (vault); set for real sending
      STALWART_RELAY_HOST: ${STALWART_RELAY_HOST:-smtp.tobias-weiss.org}
      STALWART_RELAY_USER: ${STALWART_RELAY_USER:-}
      STALWART_RELAY_PASSWORD: ${STALWART_RELAY_PASSWORD:-}
    volumes:
      - sogo6-stalwart-data:/var/lib/stalwart
      - ./sogo6/stalwart/config.json:/etc/stalwart/config.json:ro
      # Default to the hardened local/demo config (config.test.toml): it matches
      # the demo LDAP seed (dc=example,dc=org) and delivers only locally (no
      # external relay). Production / real-sending deployments MUST set
      # STALWART_CONFIG_FILE=./sogo6/stalwart/config.toml to enable the operator
      # smarthost relay (tobias-weiss.org) and the production domain.
      - ${STALWART_CONFIG_FILE:-./sogo6/stalwart/config.test.toml}:/etc/stalwart/config.toml:ro
    # The image default CMD (`--config /etc/stalwart/config.json`) starts Stalwart
    # with an (initially empty) config store; the server config from the selected
    # config file (config.test.toml by default — local LDAP directory, no relay;
    # or config.toml for the operator relay to tobias-weiss.org) is applied at
    # runtime via the management API once the relay credentials are available.
    ports:
      - "${STALWART_SMTP_PORT:-20025}:25"
      - "${STALWART_SMTPS_PORT:-20465}:465"
      - "${STALWART_SMTPSUB_PORT:-20587}:587"
      - "${STALWART_IMAP_PORT:-20143}:143"
      - "${STALWART_IMAPS_PORT:-20993}:993"
      - "${STALWART_SIEVE_PORT:-24190}:4190"
    networks:
      - sogo6-net
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'cat < /dev/null > /dev/tcp/127.0.0.1/25'"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

# ────────────────────────────────────────────────────────────
# OPTIONAL TOOLS — enable with extra profiles
# ────────────────────────────────────────────────────────────

  sogo6-agent:
    profiles: ["agent"]
    image: sogo6-server:latest
    restart: unless-stopped
    container_name: sogo6-agent
    environment:
      # ⚠️ Database config is in sogo6/config/process.conf (SOGO_P_DB_* settings)
      SOGO_REDIS_URI: redis://sogo6-redis:6379/0
    volumes:
      - ./sogo6/config/process.conf:/etc/sogo/process.conf:ro
    networks:
      - sogo6-net
    depends_on:
      sogo6-redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 256M
    command: ["python", "-m", "app.agent.run"]
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'app.agent.run' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  sogo6-minio:
    profiles: ["minio"]
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    restart: unless-stopped
    container_name: sogo6-minio
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:-minioadmin}
      # ⚠️  Change in production — set MINIO_PASSWORD env var
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:-}
    command: server /data --console-address ":9001"
    volumes:
      - sogo6-minio-data:/data
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    networks:
      - sogo6-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 256M

  sogo6-prometheus:
    profiles: ["monitoring"]
    image: prom/prometheus:v2.54.1
    restart: unless-stopped
    container_name: sogo6-prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    networks:
      - sogo6-net
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9090/-/ready"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  sogo6-grafana:
    profiles: ["monitoring"]
    image: grafana/grafana:11.3.0
    restart: unless-stopped
    container_name: sogo6-grafana
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_INSTALL_PLUGINS: grafana-lokiexplore-app
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/provisioning/dashboards/sogo6-overview.json
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    networks:
      - sogo6-net
    depends_on:
      - sogo6-prometheus
      - sogo6-loki
    volumes:
      - sogo6-grafana-data:/var/lib/grafana
      - ./sogo6/monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - ./sogo6/monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  # ── Loki (log aggregation, monitoring profile) ──────────────
  sogo6-loki:
    profiles: ["monitoring"]
    image: grafana/loki:3.4.2
    restart: unless-stopped
    container_name: sogo6-loki
    ports:
      - "${LOKI_PORT:-3100}:3100"
    networks:
      - sogo6-net
    volumes:
      - ./sogo6/monitoring/loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - sogo6-loki-data:/loki
    command: -config.file=/etc/loki/loki-config.yaml
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3100/ready"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  # ── Promtail (log collector, monitoring profile) ────────────
  sogo6-promtail:
    profiles: ["monitoring"]
    image: grafana/promtail:3.4.2
    restart: unless-stopped
    container_name: sogo6-promtail
    networks:
      - sogo6-net
    volumes:
      - ./sogo6/monitoring/loki/promtail-config.yaml:/etc/promtail/promtail-config.yaml:ro
      - sogo6-logs:/var/log/sogo:ro
      - /var/log:/var/log/host:ro
    command: -config.file=/etc/promtail/promtail-config.yaml
    depends_on:
      - sogo6-loki
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9080/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M

  # ── Keycloak (OIDC IdP, Tier 3 #39) ────────────────────────
  sogo6-keycloak:
    profiles: ["keycloak"]
    image: quay.io/keycloak/keycloak:26.0
    restart: unless-stopped
    container_name: sogo6-keycloak
    environment:
      KC_DB: mariadb
      KC_DB_URL: jdbc:mariadb://sogo6-mariadb:3306/keycloak
      KC_DB_USERNAME: ${MARIADB_USER:-sogo}
      KC_DB_PASSWORD: ${MARIADB_PASSWORD:-sogo}
      KC_HOSTNAME: localhost
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      # ⚠️  Change in production — set KEYCLOAK_PASSWORD env var
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_PASSWORD:-}
    command: start-dev
    ports:
      - "${KEYCLOAK_PORT:-8443}:8443"
    networks:
      - sogo6-net
    depends_on:
      sogo6-mariadb:
        condition: service_healthy
      sogo6-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080 && echo -e 'GET /health/ready HTTP/1.1\r\nhost: localhost\r\nconnection: close\r\n\r\n' >&3 && head -1 <&3 | grep -q '200' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

  # ── Collabora Online (Document Preview, Tier 3 #42) ──────
  sogo6-collabora:
    profiles: ["collabora"]
    image: collabora/code:24.04.9.3.1
    restart: unless-stopped
    container_name: sogo6-collabora
    environment:
      aliasgroup1: https://localhost:443
      username: ${COLLABORA_USERNAME:-admin}
      # ⚠️  Change in production — set COLLABORA_PASSWORD env var
      password: ${COLLABORA_PASSWORD:-}
      extra_params: --o:ssl.enable=false --o:ssl.termination=true
    ports:
      - "${COLLABORA_PORT:-9980}:9980"
    networks:
      - sogo6-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9980/lool/health-check"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 512M

volumes:
  sogo6-postgres-data:
  sogo6-mariadb-data:
  sogo6-stalwart-data:
  sogo6-logs:
  sogo6-loki-data:
  sogo6-grafana-data:
  sogo6-ldap-data:
  sogo6-ldap-config:
  sogo6-minio-data:

networks:
  sogo6-net:
    driver: bridge
