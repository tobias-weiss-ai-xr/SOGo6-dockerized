# SOGo 6 — Modular Docker Compose
# ================================
# Pick your infrastructure by enabling profiles:
#
#   # Stalwart (IMAP+SMTP) + PostgreSQL (default)
#   docker compose --profile mail-stalwart --profile db-postgres --profile auth-ldap up -d
#
#   # Minimal — bring your own everything (DB, mail, auth)
#   docker compose up -d
#
#   # MariaDB instead of PostgreSQL
#   docker compose --profile mail-stalwart --profile db-mariadb --profile auth-ldap up -d
#
#   # Dovecot + Exim + MariaDB (your own mail + DB)
#   docker compose --profile db-mariadb up -d
#   # Then configure SOGO_D_IMAP_SERVER / SOGO_D_SMTP_SERVER via Admin API
#
# All environment variables have sensible defaults. Override via .env file.

name: sogo6

# ────────────────────────────────────────────────────────────
# CORE — always started, minimal footprint
# ────────────────────────────────────────────────────────────

services:
  # SOGo UI — Next.js frontend
  sogo6-ui:
    image: sogo6-ui:latest
    container_name: sogo6-ui
    build:
      context: ./sogo6-ui
      dockerfile: Dockerfile
    environment:
      REACT_APP_API_BASE_URL: http://sogo6-server:5000/api/user/v1
      NEXT_PUBLIC_ADMIN_DOMAINS: admin.localhost
      SSE_ENABLED: "false"
      LOGIN_PREFILL_EMAIL: ${SOGO_TEST_USER:-mmustermann@example.org}
      LOGIN_PREFILL_PASSWORD: ${SOGO_TEST_PASS:-UniMarburg2026!}
      HOSTNAME: 0.0.0.0
    ports:
      - "${UI_PORT:-3000}:3000"
    networks:
      - sogo6-net
    depends_on:
      sogo6-server:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000/env || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # SOGo API Server — Flask backend
  sogo6-server:
    image: sogo6-server:dev
    container_name: sogo6-server
    build:
      context: ./sogo6-server
      dockerfile: deploy/local/Dockerfile.local
      target: development
    environment:
      FLASK_ENV: ${FLASK_ENV:-development}
      SOGO_DB_URI: ${SOGO_DB_URI:-postgresql://sogo:sogo@sogo6-postgres:5432/sogo}
      SOGO_REDIS_URI: redis://sogo6-redis:6379/0
      SOGO_LDAP_URI: ${SOGO_LDAP_URI:-ldap://sogo6-ldap:389}
      SOGO_LDAP_BASE_DN: ${SOGO_LDAP_BASE_DN:-dc=example,dc=org}
      SOGO_LDAP_BIND_DN: ${SOGO_LDAP_BIND_DN:-cn=admin,dc=example,dc=org}
      SOGO_LDAP_BIND_PASSWORD: ${SOGO_LDAP_BIND_PASSWORD:-}
      SOGO_SMTP_SERVER: ${SOGO_SMTP_SERVER:-sogo6-stalwart}
      SOGO_SMTP_PORT: ${SOGO_SMTP_PORT:-20025}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SOGO_LOG_LEVEL: ${SOGO_LOG_LEVEL:-info}
      SOGO_JSON_LOG: ${SOGO_JSON_LOG:-0}
      SOGO_LOG_DIR: ${SOGO_LOG_DIR:-/var/log/sogo}
      SOGO_PROPAGATE_REQUEST_ID: ${SOGO_PROPAGATE_REQUEST_ID:-0}
    volumes:
      - ./sogo6/config/process.conf:/etc/sogo/process.conf:ro
      - ./sogo6-server:/app:cached
      - sogo6-logs:/var/log/sogo
    ports:
      - "${API_PORT:-5001}:5000"
    networks:
      - sogo6-net
    depends_on:
      sogo6-redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 768M
          cpus: "2.0"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/user/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
      # Note: healthcheck succeeds even without a database if the API process is running.
      # A running database is required for most API operations.

  # Redis — session cache + Celery broker
  sogo6-redis:
    image: redis:7-alpine
    container_name: sogo6-redis
    networks:
      - sogo6-net
    deploy:
      resources:
        limits:
          memory: 128M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Nginx — reverse proxy + TLS termination
  sogo6-nginx:
    profiles: ["nginx"]
    image: nginx:alpine
    container_name: sogo6-nginx
    volumes:
      - ./sogo6/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./sogo6/nginx/certs:/etc/nginx/certs:ro
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    networks:
      - sogo6-net
    depends_on:
      - sogo6-ui
      - sogo6-server
    deploy:
      resources:
        limits:
          memory: 64M
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 5s
      retries: 3

# ────────────────────────────────────────────────────────────
# INFRASTRUCTURE — pick what you need via profiles
# ────────────────────────────────────────────────────────────

  # OpenLDAP — user directory / authentication
  sogo6-ldap:
    profiles: ["auth-ldap"]
    image: sogo6-ldap:latest
    build:
      context: ./sogo6/ldap
      dockerfile: Dockerfile
    container_name: sogo6-ldap
    environment:
      LDAP_ORGANISATION: ${LDAP_ORGANISATION:-Example Org}
      LDAP_DOMAIN: ${LDAP_DOMAIN:-example.org}
      # ⚠️  Change these in production — generate strong passwords and set via env
      LDAP_ADMIN_PASSWORD: ${LDAP_ADMIN_PASSWORD:-}
      LDAP_CONFIG_PASSWORD: ${LDAP_CONFIG_PASSWORD:-}
      LDAP_SEED_INTERNAL_LDIF_PATH: /ldif-seed
    volumes:
      - sogo6-ldap-data:/var/lib/ldap
      - sogo6-ldap-config:/etc/ldap/slapd.d
      - ./sogo6/ldap/init.ldif:/ldif-seed/00-init.ldif
    ports:
      - "${LDAP_PORT:-389}:389"
    networks:
      - sogo6-net
    deploy:
      resources:
        limits:
          memory: 128M
    healthcheck:
      # Use a wrapper that falls back to anonymous bind when no admin password is set
      test: ["CMD-SHELL", "PASS=${LDAP_ADMIN_PASSWORD}; ldapsearch -x -H ldap://localhost:389 -b ${LDAP_BASE_DN:-dc=example,dc=org} ${PASS:+-D cn=admin,${LDAP_BASE_DN:-dc=example,dc=org} -w $PASS} -s base 2>/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  # PostgreSQL — default application database
  sogo6-postgres:
    profiles: ["db-postgres"]
    image: postgres:15-alpine
    container_name: sogo6-postgres
    environment:
      POSTGRES_USER: ${PG_USER:-sogo}
      # ⚠️  Change in production — set PG_PASSWORD env var to a strong password
      POSTGRES_PASSWORD: ${PG_PASSWORD:-}
      POSTGRES_DB: ${PG_DATABASE:-sogo}
    volumes:
      - sogo6-postgres-data:/var/lib/postgresql/data
    ports:
      - "${PG_PORT:-5432}:5432"
    networks:
      - sogo6-net
    deploy:
      resources:
        limits:
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-sogo}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MariaDB — alternative application database
  sogo6-mariadb:
    profiles: ["db-mariadb"]
    image: mariadb:11
    container_name: sogo6-mariadb
    environment:
      # ⚠️  Change in production — set MARIADB_ROOT_PASSWORD / MARIADB_PASSWORD
      MYSQL_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-}
      MYSQL_USER: ${MARIADB_USER:-sogo}
      MYSQL_PASSWORD: ${MARIADB_PASSWORD:-}
      MYSQL_DATABASE: ${MARIADB_DATABASE:-sogo}
    volumes:
      - sogo6-mariadb-data:/var/lib/mysql
    ports:
      - "${MARIADB_PORT:-3306}:3306"
    networks:
      - sogo6-net
    deploy:
      resources:
        limits:
          memory: 256M
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Stalwart — IMAP + SMTP + Sieve mail server
  sogo6-stalwart:
    profiles: ["mail-stalwart"]
    image: stalwartlabs/stalwart:${STALWART_VERSION:-0.16.0}
    container_name: sogo6-stalwart
    depends_on:
      sogo6-redis:
        condition: service_healthy
    environment:
      STALWART_RECOVERY_ADMIN: admin:${STALWART_SECRET:-eval_admin_2026}
      STALWART_HOSTNAME: mail.${LDAP_DOMAIN:-example.org}
      # ⚠️  Change in production — set STALWART_DB_PASSWORD env var
      STALWART_DB_PASSWORD: ${STALWART_DB_PASSWORD:-}
    volumes:
      - sogo6-stalwart-data:/var/lib/stalwart
      - ./sogo6/stalwart/config.json:/etc/stalwart/config.json:ro
    ports:
      - "${STALWART_SMTP_PORT:-20025}:25"
      - "${STALWART_SMTPS_PORT:-20465}:465"
      - "${STALWART_SMTPSUB_PORT:-20587}:587"
      - "${STALWART_IMAP_PORT:-20143}:143"
      - "${STALWART_IMAPS_PORT:-20993}:993"
      - "${STALWART_SIEVE_PORT:-24190}:4190"
    networks:
      - sogo6-net
    deploy:
      resources:
        limits:
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "ss -tln | grep -q ':143 '"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

# ────────────────────────────────────────────────────────────
# OPTIONAL TOOLS — enable with extra profiles
# ────────────────────────────────────────────────────────────

  sogo6-agent:
    profiles: ["agent"]
    image: sogo6-server:latest
    container_name: sogo6-agent
    environment:
      SOGO_DB_URI: ${SOGO_DB_URI:-postgresql://sogo:sogo@sogo6-postgres:5432/sogo}
      SOGO_REDIS_URI: redis://sogo6-redis:6379/0
    volumes:
      - ./sogo6/config/process.conf:/etc/sogo/process.conf:ro
    networks:
      - sogo6-net
    depends_on:
      sogo6-redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256M
    command: ["python", "-m", "app.agent.run"]

  sogo6-minio:
    profiles: ["minio"]
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    container_name: sogo6-minio
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:-minioadmin}
      # ⚠️  Change in production — set MINIO_PASSWORD env var
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:-}
    command: server /data --console-address ":9001"
    volumes:
      - sogo6-minio-data:/data
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    networks:
      - sogo6-net
    deploy:
      resources:
        limits:
          memory: 256M

  sogo6-prometheus:
    profiles: ["monitoring"]
    image: prom/prometheus:v2.54.1
    container_name: sogo6-prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    networks:
      - sogo6-net
    deploy:
      resources:
        limits:
          memory: 256M

  sogo6-grafana:
    profiles: ["monitoring"]
    image: grafana/grafana:11.3.0
    container_name: sogo6-grafana
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_INSTALL_PLUGINS: grafana-lokiexplore-app
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/provisioning/dashboards/sogo6-overview.json
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    networks:
      - sogo6-net
    depends_on:
      - sogo6-prometheus
      - sogo6-loki
    volumes:
      - sogo6-grafana-data:/var/lib/grafana
      - ./sogo6/grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - ./sogo6/prometheus/grafana-dashboards:/etc/grafana/provisioning/dashboards:ro
    deploy:
      resources:
        limits:
          memory: 256M

  # ── Loki (log aggregation, monitoring profile) ──────────────
  sogo6-loki:
    profiles: ["monitoring"]
    image: grafana/loki:3.4.2
    container_name: sogo6-loki
    ports:
      - "${LOKI_PORT:-3100}:3100"
    networks:
      - sogo6-net
    volumes:
      - ./sogo6/loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - sogo6-loki-data:/loki
    command: -config.file=/etc/loki/loki-config.yaml
    deploy:
      resources:
        limits:
          memory: 512M

  # ── Promtail (log collector, monitoring profile) ────────────
  sogo6-promtail:
    profiles: ["monitoring"]
    image: grafana/promtail:3.4.2
    container_name: sogo6-promtail
    networks:
      - sogo6-net
    volumes:
      - ./sogo6/loki/promtail-config.yaml:/etc/promtail/promtail-config.yaml:ro
      - sogo6-logs:/var/log/sogo:ro
      - /var/log:/var/log/host:ro
    command: -config.file=/etc/promtail/promtail-config.yaml
    depends_on:
      - sogo6-loki
    deploy:
      resources:
        limits:
          memory: 128M

  # ── Keycloak (OIDC IdP, Tier 3 #39) ────────────────────────
  sogo6-keycloak:
    profiles: ["keycloak"]
    image: quay.io/keycloak/keycloak:25.0
    container_name: sogo6-keycloak
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://sogo6-postgres:5432/keycloak
      KC_DB_USERNAME: ${PG_USER:-sogo}
      KC_DB_PASSWORD: ${PG_PASSWORD:-sogo}
      KC_HOSTNAME: localhost
      KEYCLOAK_ADMIN: admin
      # ⚠️  Change in production — set KEYCLOAK_PASSWORD env var
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_PASSWORD:-}
    command: start-dev
    ports:
      - "${KEYCLOAK_PORT:-8443}:8443"
    networks:
      - sogo6-net
    depends_on:
      sogo6-postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1G

  # ── Collabora Online (Document Preview, Tier 3 #42) ──────
  sogo6-collabora:
    profiles: ["collabora"]
    image: collabora/code:24.04.9.3.1
    container_name: sogo6-collabora
    environment:
      aliasgroup1: https://localhost:443
      username: ${COLLABORA_USERNAME:-admin}
      # ⚠️  Change in production — set COLLABORA_PASSWORD env var
      password: ${COLLABORA_PASSWORD:-}
      extra_params: --o:ssl.enable=false --o:ssl.termination=true
    ports:
      - "${COLLABORA_PORT:-9980}:9980"
    networks:
      - sogo6-net
    deploy:
      resources:
        limits:
          memory: 512M

volumes:
  sogo6-postgres-data:
  sogo6-mariadb-data:
  sogo6-stalwart-data:
  sogo6-logs:
  sogo6-loki-data:
  sogo6-grafana-data:
  sogo6-ldap-data:
  sogo6-ldap-config:
  sogo6-minio-data:

networks:
  sogo6-net:
    driver: bridge
