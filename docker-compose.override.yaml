# Development override for docker-compose.yaml
# ==============================================
# This file extends the MAIN stack (docker-compose.yaml) with development
# settings like hot-reload volume mounts and debug flags.
#
# Usage:
#   docker compose -f docker-compose.yaml -f docker-compose.override.yaml up
#
# ── Docker Compose Dev Files Explained ───────────────────────
#
# docker-compose.dev.yaml   — STANDALONE dev stack (593 lines, self-contained)
#                             Has extra tools: pgadmin, redisinsight, mailhog
#                             Use: docker compose -f docker-compose.dev.yaml up
#
# docker-compose.override.yaml — EXTENDS main compose (68 lines, lightweight)
#                               Adds hot-reload, debug flags. No extra tools.
#                               Use: docker compose -f docker-compose.yaml \
#                                      -f docker-compose.override.yaml up
#
# Pick one based on whether you need the extra dev tools.
# ==============================================================

services:
  sogo6-ui:
    build:
      target: development
    environment:
      NODE_ENV: development
      DEBUG: "true"
    volumes:
      - ./sogo6-ui:/app:cached
      - /app/node_modules
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "2.0"

  sogo6-server:
    build:
      target: development
    environment:
      FLASK_ENV: development
      FLASK_DEBUG: "1"
      PYTHONUNBUFFERED: "1"
      LOG_LEVEL: debug
    volumes:
      - ./sogo6-server:/app:cached
    deploy:
      resources:
        limits:
          memory: 768M
          cpus: "2.0"

  sogo6-postgres:
    environment:
      POSTGRES_LOG_STATEMENT: "all"
      POSTGRES_LOG_DURATION: "on"
    command: >
      postgres
        -c shared_buffers=256MB
        -c work_mem=16MB
        -c max_connections=100
        -c log_statement=all
        -c log_duration=on
    deploy:
      resources:
        limits:
          memory: 512M

  sogo6-mariadb:
    environment:
      MYSQL_LOG_CONSOLE: "true"
      MYSQL_DEBUG: "true"
    deploy:
      resources:
        limits:
          memory: 512M

  sogo6-redis:
    command: redis-server --maxmemory 256mb --appendonly yes --loglevel debug
    deploy:
      resources:
        limits:
          memory: 256M

  sogo6-ldap:
    environment:
      SLAPD_LOG_LEVEL: "32768"
    deploy:
      resources:
        limits:
          memory: 256M
