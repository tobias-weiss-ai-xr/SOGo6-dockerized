# Grafana datasource provisioning — SOGo 6 monitoring stack
# https://grafana.com/docs/grafana/latest/administration/provisioning/#data-sources
apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://sogo6-prometheus:9090
    isDefault: true
    editable: false

  - name: Loki
    type: loki
    access: proxy
    url: http://sogo6-loki:3100
    isDefault: false
    editable: false
    jsonData:
      maxLines: 1000
      derivedFields:
        - name: request_id
          type: field
          matcherRegex: '"request_id":"([^"]+)"'
          url: '${__value.raw}'
          urlDisplayLabel: 'Request ID'
