# Prometheus Alerting Rules for SOGo6 Stack
# Matches actual metrics exported by the SOGo6 server (sogo_ prefix)
groups:
  - name: sogo6-server
    rules:
      - alert: SOGo6ServerDown
        expr: up{job="sogo6-server"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "SOGo6 Server is down"

      - alert: SOGo6HighErrorRate
        expr: |
          sum(rate(sogo_http_errors_total{job="sogo6-server"}[5m]))
          / sum(rate(sogo_http_requests_total{job="sogo6-server"}[5m])) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High error rate on SOGo6 Server"
          description: "Error rate is {{ $value | humanizePercentage }} over 5m"

      - alert: SOGo6HighLatency
        expr: histogram_quantile(0.95, sum(rate(sogo_http_request_duration_seconds_bucket{job="sogo6-server"}[5m])) by (le)) > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High latency on SOGo6 Server"
          description: "95th percentile latency is {{ $value }}s over 5m"

      - alert: SOGo6DownstreamDegraded
        expr: |
          sogo_http_errors_total{job="sogo6-server", status=~"5.."}
          > 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "SOGo6 downstream errors"
          description: "Server returning 5xx errors — check DB/cache/LDAP"

  - name: sogo6-database
    rules:
      - alert: PostgreSQLDown
        expr: up{job="sogo6-postgres"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "PostgreSQL is down"

  - name: sogo6-redis
    rules:
      - alert: RedisDown
        expr: up{job="sogo6-redis"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Redis is down"

  - name: sogo6-infrastructure
    rules:
      - alert: ContainerRestartLoop
        expr: |
          sum by (container_label_com_docker_compose_service) (rate(container_cpu_usage_seconds_total[5m]))
          == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Service possibly down — no CPU activity"
          description: "Service {{ $labels.container_label_com_docker_compose_service }} shows no CPU usage"
