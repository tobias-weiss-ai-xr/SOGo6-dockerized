# SOGo 6 Process Configuration
# Copy this file to /etc/sogo/process.conf in the container

# Flask settings
FLASK_ENV=development
FLASK_APP=app

# Database settings
# ── PostgreSQL (default) ─────────────────────────────────────────────────────
# SOGO_DB_URI=postgresql://sogo:sogo@sogo6-postgres:5432/sogo
#
# ── MariaDB / MySQL (alternative, uncomment and adapt) ─────────────────────
# Set SOGO_P_DB_TYPE=MySQL and update the settings below:
# SOGO_DB_URI=mysql://sogo:sogo@sogo6-mariadb:3306/sogo
# SOGO_P_DB_TYPE=MySQL
# SOGO_P_DB_PORT=3306
#
SOGO_DB_URI=postgresql://sogo:sogo@sogo6-postgres:5432/sogo
SOGO_DB_POOL_SIZE=10
SOGO_DB_POOL_TIMEOUT=30

# Redis settings
SOGO_REDIS_URI=redis://sogo6-redis:6379/0
SOGO_REDIS_TTL=3600

# LDAP settings
SOGO_LDAP_URI=ldap://sogo6-ldap:389
SOGO_LDAP_BASE_DN=dc=example,dc=org
SOGO_LDAP_BIND_DN=cn=admin,dc=example,dc=org
# ⚠️  Set a strong password in production (override via env var SOGO_LDAP_BIND_PASSWORD)
SOGO_LDAP_BIND_PASSWORD=admin
SOGO_LDAP_USER_BASE=ou=users,dc=example,dc=org
SOGO_LDAP_USER_FILTER=(objectClass=inetOrgPerson)
SOGO_LDAP_USER_NAME_ATTRIBUTE=uid
SOGO_LDAP_USER_MAIL_ATTRIBUTE=mail
SOGO_LDAP_USER_CN_ATTRIBUTE=cn

# SMTP settings
SOGO_SMTP_SERVER=sogo6-smtp
SOGO_SMTP_PORT=25
SOGO_SMTP_USE_TLS=false
SOGO_SMTP_FROM_ADDRESS=noreply@example.org

# Security settings
# ⚠️  MUST change in production — generate with: openssl rand -base64 32
SOGO_SECRET_KEY=change-me-in-production
SOGO_SESSION_TTL=86400
SOGO_PASSWORD_MIN_LENGTH=8

# Server settings
SOGO_BIND_ADDRESS=0.0.0.0
SOGO_BIND_PORT=5000
SOGO_LOG_LEVEL=INFO

# Logging (optional — file rotation enabled when SOGO_LOG_DIR is set)
# SOGO_LOG_DIR=/var/log/sogo
# SOGO_LOG_FILE=/var/log/sogo/sogo.log
# SOGO_JSON_LOG=1                          # structured JSON output
# SOGO_PROPAGATE_REQUEST_ID=1              # trust upstream X-Request-Id

# Process settings (required by pydantic ProcessSetting)
SOGO_P_REDIS_URL=redis://sogo6-redis:6379/0
# ⚠️  All the below MUST be changed in production
SOGO_P_VOUCHER_SECRET=0123456789abcdef0123456789abcdef
SOGO_AES_ENC_KEY=change-me-32-chars-aes-key!
SOGO_P_ADMIN=admin
SOGO_P_ADMIN_PWD=admin
SOGO_P_DB_USER=sogo
SOGO_P_DB_PASS=sogo
SOGO_P_DB_HOST=sogo6-postgres
