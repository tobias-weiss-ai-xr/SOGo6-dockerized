# SOGo 6 Process Configuration
# =============================
# Environment variables take precedence over values in this file.
# All sensitive values MUST be set via environment variables in production.
# Required env vars: SOGO_LDAP_BIND_PASSWORD, SOGO_SECRET_KEY,
#   SOGO_AES_ENC_KEY, SOGO_P_VOUCHER_SECRET, SCIM_BEARER_TOKEN

# Flask settings
FLASK_ENV=production
FLASK_APP=app

# Database settings
# ── MariaDB / MySQL (default) ───────────────────────────────────────────────
# SOGO_P_DB_TYPE=MySQL
SOGO_P_DB_USER=sogo
SOGO_P_DB_PASS=sogo_password_change_me
# SOGO_P_DB_HOST=sogo6-mariadb
# SOGO_P_DB_PORT=3306
#
# ── PostgreSQL (alternative) ───────────────────────────────────────────────
SOGO_P_DB_TYPE=PostgreSQL
# SOGO_P_DB_USER=sogo
# SOGO_P_DB_PASS=sogo_password_change_me
SOGO_P_DB_HOST=sogo6-postgres
SOGO_P_DB_PORT=5432
#
SOGO_DB_POOL_SIZE=10
SOGO_DB_POOL_TIMEOUT=30

# Redis settings
SOGO_REDIS_URI=redis://sogo6-redis:6379/0
SOGO_REDIS_TTL=3600

# LDAP settings
SOGO_LDAP_URI=ldap://sogo6-ldap:389
SOGO_LDAP_BASE_DN=dc=example,dc=org
SOGO_LDAP_BIND_DN=cn=admin,dc=example,dc=org
# ⚠️  Set via SOGO_LDAP_BIND_PASSWORD env var (required - overrides this file)
# WARNING: Do NOT set a password here. Use environment variables or Docker secrets.
SOGO_LDAP_BIND_PASSWORD=
SOGO_LDAP_USER_BASE=ou=users,dc=example,dc=org
SOGO_LDAP_USER_FILTER=(objectClass=inetOrgPerson)
SOGO_LDAP_USER_NAME_ATTRIBUTE=uid
SOGO_LDAP_USER_MAIL_ATTRIBUTE=mail
SOGO_LDAP_USER_CN_ATTRIBUTE=cn

# SMTP settings
# ⚠️  When using Stalwart: SOGO_SMTP_SERVER=sogo6-stalwart, port 25
#    When using external SMTP: set SOGO_SMTP_SERVER and SOGO_SMTP_PORT env vars
SOGO_SMTP_SERVER=sogo6-stalwart
SOGO_SMTP_PORT=25
SOGO_SMTP_USE_TLS=false
SOGO_SMTP_FROM_ADDRESS=noreply@example.org

# Security settings — ALL must be overridden via env vars in production
SOGO_SECRET_KEY=
SOGO_SESSION_TTL=86400
SOGO_PASSWORD_MIN_LENGTH=8

# Server settings
SOGO_BIND_ADDRESS=0.0.0.0
SOGO_BIND_PORT=5000
SOGO_LOG_LEVEL=INFO

# Logging (optional — file rotation enabled when SOGO_LOG_DIR is set)
# SOGO_LOG_DIR=/var/log/sogo
# SOGO_LOG_FILE=/var/log/sogo/sogo.log
# SOGO_JSON_LOG=1                          # structured JSON output
# SOGO_PROPAGATE_REQUEST_ID=1              # trust upstream X-Request-Id

# Process settings (required by pydantic ProcessSetting)
# ⚠️  All the below MUST be set via environment variables in production
# WARNING: Default values below are insecure. Override via environment or config.
SOGO_P_REDIS_URL=redis://sogo6-redis:6379/0
# Generate a strong secret: openssl rand -base64 32
SOGO_P_VOUCHER_SECRET=
SOGO_AES_ENC_KEY=
# Admin credentials - MUST be set to non-default values
SOGO_P_ADMIN=
SOGO_P_ADMIN_PWD=
SOGO_P_DB_USER=sogo
SOGO_P_DB_PASS=
# SOGO_P_DB_HOST=sogo6-mariadb
