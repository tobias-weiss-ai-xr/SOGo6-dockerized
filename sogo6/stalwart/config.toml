# Stalwart mail server configuration for the SOGo6 demo
#
# The image entrypoint is already `stalwart`; this file is loaded via
# `command: ["-c", "/etc/stalwart/config.toml"]`.

# ── Server listeners ──────────────────────────────────────────────────────────
[server]

[server.listener."imap"]
bind = ["[::]:143"]
protocol = "imap"

[server.listener."smtp"]
bind = ["[::]:25"]
protocol = "smtp"

[server.listener."submissions"]
bind = ["[::]:587"]
protocol = "submissions"

[server.listener."sieve"]
bind = ["[::]:4190"]
protocol = "sieve"

# ── Data store ───────────────────────────────────────────────────────────────
# SQLite keeps the demo dependency-free (no separate database required).
[store."default"]
type = "sqlite"
path = "/var/lib/stalwart/db.sqlite"

# ── User directory: the SOGo6 OpenLDAP tree ─────────────────────────────────
# dc=sogo6,dc=contextual-intelligence,dc=org (derived from SOGO_DOMAIN)
#
# The {username}/{email} placeholder is REQUIRED in `filter` — a bare
# (objectClass=inetOrgPerson) matches every entry and Stalwart binds the first
# one found, which fails authentication. `bind-authentication = true` makes
# Stalwart authenticate by binding as the user. The directory must also be the
# default authentication source ([authentication] directoryId = "ldap").
[directory."ldap"]
type = "ldap"
addresses = ["ldap://sogo6-ldap:389"]
bind-dn = "cn=admin,dc=sogo6,dc=contextual-intelligence,dc=org"
# Password is injected from the vault (.env) — never hardcoded.
bind-password = { type = "env", value = "LDAP_ADMIN_PASSWORD" }
base-dn = "ou=users,dc=sogo6,dc=contextual-intelligence,dc=org"
filter = "(|(uid={username})(mail={username}))"
bind-authentication = true

[authentication]
directoryId = "ldap"

# ── Outbound relay / smarthost: operator mailcow at tobias-weiss.org ──────────
# Auth credentials are supplied via environment (vault), not hardcoded.
[remote."tobias-weiss"]
addresses = ["smtp.tobias-weiss.org:587"]
auth.username = { type = "env", value = "STALWART_RELAY_USER" }
auth.secret = { type = "env", value = "STALWART_RELAY_PASSWORD" }

# ── Route all outbound mail through the relay ───────────────────────────────
[queue]
next-hop = ["tobias-weiss"]
