events {
  worker_connections 1024;
}

http {
  upstream sogo6-server {
    server sogo6-server:5000;
  }

  upstream sogo6-ui {
    server sogo6-ui:3000;
  }

  # Redirect HTTP to HTTPS
  server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
  }

  # HTTPS server
  server {
    listen 443 ssl default_server;
    server_name _;

    http2 on;

    ssl_certificate     /etc/nginx/certs/sogo6.crt;
    ssl_certificate_key /etc/nginx/certs/sogo6.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # API routes -> SOGo 6 Server
    location /api/ {
      proxy_pass http://sogo6-server;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection 'upgrade';
      proxy_cache_bypass $http_upgrade;
      proxy_read_timeout 120s;
      proxy_send_timeout 120s;
    }

    # UI routes -> Next.js
    location / {
      proxy_pass http://sogo6-ui;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection 'upgrade';
      proxy_cache_bypass $http_upgrade;

      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
    }
  }
}
