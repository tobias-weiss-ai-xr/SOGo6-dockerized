# SOGo 6 Development Stack
# Docker Compose orchestration with development tools

services:
  sogo6-ui:
    image: sogo6-ui:dev
    container_name: sogo6-ui-dev
    restart: unless-stopped
    build:
      context: ./sogo6-ui
      dockerfile: Dockerfile
      target: development
    environment:
      REACT_APP_API_BASE_URL: http://sogo6-server:5000/api/user/v1
      NEXT_PUBLIC_ADMIN_DOMAINS: admin.localhost
      SSE_ENABLED: "true"
      LOGIN_PREFILL_EMAIL: testuser@example.org
      LOGIN_PREFILL_PASSWORD: password123
      NODE_ENV: development
      DEBUG: "true"
      WDS_SOCKET_PORT: "3000"
      NODE_OPTIONS: "--max-old-space-size=6144"
      NEXT_TELEMETRY_DISABLED: "1"
    ports:
      - "3000:3000"
      - "24678:24678"
    networks:
      - sogo6-net
    depends_on:
      - sogo6-server
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: "4.0"
        reservations:
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000/env || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    volumes:
      - ./sogo6-ui:/app:cached
      - /app/node_modules

  sogo6-server:
    image: sogo6-server:dev
    container_name: sogo6-server-dev
    build:
      context: ./sogo6-server
      dockerfile: deploy/local/Dockerfile.local
      target: development
    environment:
      FLASK_ENV: development
      FLASK_APP: app
      FLASK_DEBUG: "1"
      PYTHONUNBUFFERED: "1"
      PYTHONFAULTHANDLER: "1"
      PYTHONDEVMODE: "1"
      SOGO_DB_URI: postgresql://sogo:sogo@sogo6-postgres:5432/sogo
      SOGO_REDIS_URI: redis://sogo6-redis:6379/0
      SOGO_LDAP_URI: ldap://sogo6-ldap:389
      SOGO_LDAP_BASE_DN: dc=example,dc=org
      SOGO_LDAP_BIND_DN: cn=admin,dc=example,dc=org
      SOGO_LDAP_BIND_PASSWORD: admin
      SOGO_SMTP_SERVER: sogo6-stalwart
      SOGO_SMTP_PORT: 20025
      SOGO_P_DB_USER: sogo
      SOGO_P_DB_HOST: sogo6-postgres
      GUNICORN_WORKERS: "1"
      LOG_LEVEL: debug
      LOG_FORMAT: "%(asctime)s %(levelname)s %(name)s: %(message)s"
    # Secrets are optional for dev - can use environment variables instead
    # Uncomment and create file if needed: env_file: - ./secrets/sogo6.vault.env
    volumes:
      - ./sogo6/config/process.conf:/etc/sogo/process.conf:ro
      - ./sogo6-server:/app:cached
    ports:
      - "5001:5000"
      - "5678:5678"
    networks:
      - sogo6-net
    depends_on:
      sogo6-postgres:
        condition: service_healthy
      sogo6-redis:
        condition: service_healthy
      sogo6-ldap:
        condition: service_healthy
      sogo6-stalwart:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 768M
          cpus: "2.0"
        reservations:
          memory: 384M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/user/v1/system"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s

  sogo6-postgres:
    image: postgres:15-alpine
    container_name: sogo6-postgres-dev
    environment:
      POSTGRES_USER: sogo
      POSTGRES_PASSWORD: sogo
      POSTGRES_DB: sogo
      POSTGRES_HOST_AUTH_METHOD: trust
      POSTGRES_LOG_STATEMENT: "all"
      POSTGRES_LOG_DURATION: "on"
    command: >
      postgres
        -c shared_buffers=256MB
        -c work_mem=16MB
        -c max_connections=100
        -c log_statement=all
        -c log_duration=on
        -c log_min_duration_statement=0
        -c log_line_prefix='%m [%p] %q%u@%d '
    volumes:
      - sogo6-postgres-data-dev:/var/lib/postgresql/data
      - ./sogo6/scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    networks:
      - sogo6-net
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sogo"]
      interval: 5s
      timeout: 3s
      retries: 5

  sogo6-redis:
    image: redis:7-alpine
    container_name: sogo6-redis-dev
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru --appendonly yes --loglevel debug
    volumes:
      - sogo6-redis-data-dev:/data
    ports:
      - "6379:6379"
    networks:
      - sogo6-net
    deploy:
      resources:
        limits:
          memory: 256M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  sogo6-ldap:
    image: sogo6-ldap:dev
    build:
      context: ./sogo6/ldap
      dockerfile: Dockerfile
    container_name: sogo6-ldap-dev
    environment:
      LDAP_ORGANISATION: Example Org
      LDAP_DOMAIN: example.org
      LDAP_ADMIN_PASSWORD: admin
      LDAP_BASE_DN: dc=example,dc=org
      LDAP_CONFIG_PASSWORD: admin
      LDAP_TLS: "false"
      LDAP_SEED_INTERNAL_LDIF_PATH: /ldif-seed
      SLAPD_LOG_LEVEL: "32768"
    volumes:
      - sogo6-ldap-data-dev:/var/lib/ldap
      - sogo6-ldap-config-dev:/etc/ldap/slapd.d
      - ./sogo6/ldap/init.ldif:/ldif-seed/00-init.ldif
    ports:
      - "389:389"
      - "636:636"
    networks:
      - sogo6-net
    deploy:
      resources:
        limits:
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "ldapsearch -x -H ldap://localhost:389 -b dc=example,dc=org -D cn=admin,dc=example,dc=org -w admin -s base 2>/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  sogo6-stalwart:
    image: stalwartlabs/stalwart:v0.16.6
    container_name: sogo6-stalwart-dev
    depends_on:
      sogo6-postgres:
        condition: service_healthy
    environment:
      STALWART_RECOVERY_ADMIN: admin:eval_admin_2026
      STALWART_HOSTNAME: mail.example.org
      STALWART_DB_PASSWORD: stalwart_sogo6_2026
      RUST_LOG: "debug"
    volumes:
      - sogo6-stalwart-data-dev:/var/lib/stalwart
      - ./sogo6/stalwart/config.json:/etc/stalwart/config.json
    ports:
      - "20025:25"
      - "20465:465"
      - "20587:587"
      - "20143:143"
      - "20993:993"
      - "24190:4190"
    networks:
      - sogo6-net
    deploy:
      resources:
        limits:
          memory: 768M
          cpus: "2.0"
        reservations:
          memory: 384M
    healthcheck:
      test: ["CMD-SHELL", "/usr/bin/curl -skf https://localhost/healthz/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  sogo6-smtp:
    image: maildev/maildev:latest
    container_name: sogo6-smtp-dev
    environment:
      MAILDEV_SMTP_PORT: 25
      MAILDEV_WEB_PORT: 1080
    ports:
      - "1080:1080"
      - "1025:1025"
    networks:
      - sogo6-net
    deploy:
      resources:
        limits:
          memory: 256M
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:1080/', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  sogo6-nginx:
    image: nginx:alpine
    container_name: sogo6-nginx-dev
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"
    volumes:
      - ./sogo6/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./sogo6/nginx/certs:/etc/nginx/certs:ro
    networks:
      - sogo6-net
    depends_on:
      - sogo6-ui
      - sogo6-server
    deploy:
      resources:
        limits:
          memory: 192M
        reservations:
          memory: 64M
    healthcheck:
      test: ["CMD-SHELL", "curl -skf https://localhost/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  # Dev Tools
  sogo6-pgadmin:
    image: dpage/pgadmin4:latest
    container_name: sogo6-pgadmin-dev
    environment:
      PGADMIN_DEFAULT_EMAIL: dev@example.org
      PGADMIN_DEFAULT_PASSWORD: password123
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    volumes:
      - sogo6-pgadmin-data:/var/lib/pgadmin
    ports:
      - "5050:80"
    networks:
      - sogo6-net
    depends_on:
      - sogo6-postgres
    deploy:
      resources:
        limits:
          memory: 256M

  sogo6-redisinsight:
    image: redis/redis-insight:latest
    container_name: sogo6-redisinsight-dev
    ports:
      - "5540:5540"
    volumes:
      - sogo6-redisinsight-data:/var/lib/redisinsight
    networks:
      - sogo6-net
    depends_on:
      - sogo6-redis
    deploy:
      resources:
        limits:
          memory: 256M
    profiles:
      - mail-tools

  sogo6-ldapadmin:
    image: osixia/openldap:1.5.0
    container_name: sogo6-ldapadmin-dev
    environment:
      LDAP_ADMIN_PASSWORD: admin
    ports:
      - "8081:80"
    networks:
      - sogo6-net
    depends_on:
      sogo6-ldap:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 128M
    profiles:
      - ldap-tools

  sogo6-ldapui:
    image: pulsetri/react-ldap-admin:latest
    container_name: sogo6-ldapui-dev
    environment:
      LDAP_HOST: sogo6-ldap
      LDAP_PORT: 389
      LDAP_BASE_DN: dc=example,dc=org
      LDAP_BIND_DN: cn=admin,dc=example,dc=org
      LDAP_BIND_PASSWORD: admin
    ports:
      - "8082:3000"
    networks:
      - sogo6-net
    depends_on:
      sogo6-ldap:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 128M
    profiles:
      - ldap-tools

  sogo6-mailhog:
    image: mailhog/mailhog:latest
    container_name: sogo6-mailhog-dev
    ports:
      - "8025:8025"
      - "1026:1025"
    networks:
      - sogo6-net
    deploy:
      resources:
        limits:
          memory: 128M
    profiles:
      - mail-tools

  sogo6-prometheus:
    image: prom/prometheus:latest
    container_name: sogo6-prometheus-dev
    volumes:
      - ./sogo6/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - sogo6-prometheus-data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - sogo6-net
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    deploy:
      resources:
        limits:
          memory: 512M
    profiles:
      - monitoring

  sogo6-grafana:
    image: grafana/grafana:latest
    container_name: sogo6-grafana-dev
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: password123
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - sogo6-grafana-data:/var/lib/grafana
    ports:
      - "3001:3000"
    networks:
      - sogo6-net
    depends_on:
      - sogo6-prometheus
    deploy:
      resources:
        limits:
          memory: 256M
    profiles:
      - monitoring

  sogo6-ladon:
    image: orlangur/ladon:latest
    container_name: sogo6-ladon-dev
    environment:
      LADON_LDAP_HOST: sogo6-ldap
      LADON_LDAP_PORT: 389
      LADON_LDAP_BASE_DN: dc=example,dc=org
      LADON_LDAP_BIND_DN: cn=admin,dc=example,dc=org
      LADON_LDAP_BIND_PASSWORD: admin
    ports:
      - "8083:8080"
    networks:
      - sogo6-net
    depends_on:
      sogo6-ldap:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 128M
    profiles:
      - ldap-tools

  sogo6-wd-ldap:
    image: osixia/phpldapadmin:latest
    container_name: sogo6-wd-ldap-dev
    environment:
      PHPLDAPADMIN_LDAP_HOSTS: sogo6-ldap
      PHPLDAPADMIN_LDAP_CLIENT_TLS_REQCERT: "never"
    ports:
      - "8084:80"
    networks:
      - sogo6-net
    depends_on:
      sogo6-ldap:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 128M
    profiles:
      - ldap-tools

volumes:
  sogo6-postgres-data-dev:
  sogo6-redis-data-dev:
  sogo6-stalwart-data-dev:
  sogo6-ldap-data-dev:
  sogo6-ldap-config-dev:
  sogo6-pgadmin-data:
  sogo6-redisinsight-data:
  sogo6-prometheus-data:
  sogo6-grafana-data:

networks:
  sogo6-net:
