apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "sogo6.fullname" . }}-postgres
  labels: {{ include "sogo6.labels" . | nindent 4 }}
spec:
  accessModes: [{{ .Values.persistence.accessMode }}]
  {{- if .Values.persistence.storageClass }}
  storageClassName: {{ .Values.persistence.storageClass }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.size.postgres }}
---
