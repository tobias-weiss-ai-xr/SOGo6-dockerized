apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "sogo6.fullname" . }}-default-deny
  labels: {{ include "sogo6.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "sogo6.fullname" . }}-allow-internal
  labels: {{ include "sogo6.labels" . | nindent 4 }}
spec:
  podSelector: {}
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{ include "sogo6.selectorLabels" . | nindent 14 }}
  egress:
    - to:
        - podSelector:
            matchLabels:
              {{ include "sogo6.selectorLabels" . | nindent 14 }}
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
  podSelector: {}
---
{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "sogo6.fullname" . }}-allow-ingress
  labels: {{ include "sogo6.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      component: ui
  ingress:
    - from:
        - namespaceSelector: {}
      ports:
        - port: 3000
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "sogo6.fullname" . }}-allow-api
  labels: {{ include "sogo6.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      component: server
  ingress:
    - from:
        - namespaceSelector: {}
      ports:
        - port: 5000
          protocol: TCP
{{- end }}
