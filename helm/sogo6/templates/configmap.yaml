apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "sogo6.configmap" . }}
  labels: {{ include "sogo6.labels" . | nindent 4 }}
data:
  process.conf: |
    [server]
    host = 0.0.0.0
    port = 5000
    workers = 4
    timeout = 120

    [auth]
    jwt_secret = file:///etc/sogo/secrets/SOGO_AES_ENC_KEY
    jwt_algorithm = HS256
    session_timeout_minutes = 480

    [database]
    type = PostgreSQL

    [redis]
    resp3 = false

    [logging]
    level = {{ .Values.env.SOGO_LOG_LEVEL | default "info" }}
    json = {{ .Values.env.SOGO_JSON_LOG | default "1" }}
    directory = /var/log/sogo
