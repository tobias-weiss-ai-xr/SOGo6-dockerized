apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "sogo6.fullname" . }}-postgres
  labels: {{ include "sogo6.labels" . | nindent 4 }}
    component: postgres
spec:
  serviceName: {{ include "sogo6.fullname" . }}-postgres
  replicas: 1
  selector:
    matchLabels:
      {{ include "sogo6.selectorLabels" . | nindent 6 }}
      component: postgres
  template:
    metadata:
      labels:
        {{ include "sogo6.selectorLabels" . | nindent 8 }}
        component: postgres
    spec:
      containers:
        - name: postgres
          image: {{ include "sogo6.image" (dict "repository" .Values.image.postgres.repository "tag" .Values.image.postgres.tag "Values" .Values) }}
          imagePullPolicy: {{ .Values.image.postgres.pullPolicy }}
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: sogo
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "sogo6.secret" . }}
                  key: SOGO_P_DB_PASS
            - name: POSTGRES_DB
              value: sogo
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          livenessProbe:
            exec:
              command: [pg_isready, -U, sogo]
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            exec:
              command: [pg_isready, -U, sogo]
            initialDelaySeconds: 5
            periodSeconds: 5
          resources: {{ toYaml .Values.resources.postgres | nindent 12 }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [{{ .Values.persistence.accessMode }}]
        {{- if .Values.persistence.storageClass }}
        storageClassName: {{ .Values.persistence.storageClass }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.size.postgres }}
